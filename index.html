    if (dungeon.players.some(p=>p.id===newId)){
      toast("That code's already used — pick another, or use Restore below if it's yours");
      return;
    }
    const cls=$("d_class").querySelector(".on").getAttribute("data-dcls");
    if ((dClassCounts()[cls]||0) >= CLASS_CAP){ toast(DCLASSES[cls].n+" just filled up — pick another class"); render(); return; }
    me.id = newId; me.name = name; me.code = rawCode; saveMe();
    dungeon.players.push({id:me.id,name,cls,gold:0,xp:0,hand:[],discard:[],lost:[],hp:0,maxHp:0,zone:0,shield:0,taunt:false,ko:false,selected:null,deck:[]});
    logD(`<b>${esc(name)}</b> the ${DCLASSES[cls].n} joins the Gauntlet`);
    saveDungeon(); render();
    if (!store.getItem("azsd.tutSeen")) dShowTutorial();
    return;
  }
  if (t.id==="d_dorestore"){
    const rawCode=($("d_restore")&&$("d_restore").value||"").trim();
    const wantId = dCodeToId(rawCode);
    if (!wantId){ toast("Enter your recovery code"); return; }
    const found = dungeon.players.find(p=>p.id===wantId);
    if (!found){
      toast(syncOn ? "No character found with that code" : "Can't check while offline — connect first");
      return;
    }
    me.id = wantId; me.name = found.name; me.code = rawCode; saveMe();
    render();
    toast("Welcome back, "+found.name);
    return;
  }
  if (t.id==="d_nudge"){
    if (dBusy) return; dBusy=true;
    dResolveMonsterNow();
    dBusy=false; return;
  }
  if (t.id==="d_centremap"){ dCentreMapOnMe(); return; }
  if (t.id==="d_clearerr"){ dSyncError=""; render(); return; }
  if (t.id==="d_retrysync"){
    dSyncStage="starting"; dSyncError=""; dSyncToastShown=false;
    toast("Reconnecting…"); render(); initSync(); return;
  }
  if (t.id==="d_resetall"){
    if (!dIAmHost()){ toast("Only "+(dungeon.hostName||"the host")+" can reset this"); return; }
    if (confirm("Reset the whole Gauntlet — everyone's characters, progress, and the host claim? This can't be undone.")){
      dungeon = newDungeon(); saveDungeon(); render(); toast("Gauntlet reset");
    }
    return;
  }
  if (t.id==="d_claimhost"){
    /* we already know who they are — host is only claimable once a character
       exists, so take the name straight off it instead of asking again */
    const mine = myDP();
    if (!mine){ toast("Create your character first — host is tied to it"); return; }
    dClaimHostSafely(mine.name);
    return;
  }
  if (t.id==="d_releasehost"){
    if (dungeon.hostId !== me.id){ toast("You're not the host"); return; }
    if (!confirm("Release host? Someone else will be able to claim it.")) return;
    dungeon.hostId = null; dungeon.hostName = null;
    saveDungeon(); render(); toast("Host released");
    return;
  }
  if (t.id==="d_setcount"){
    const n = +(($("d_count")&&$("d_count").value)||0);
    if (!n || n<1){ toast("Enter a number first"); return; }
    dungeon.expectedCount = Math.round(n);
    saveDungeon(); render(); return;
  }
  if (t.id==="d_tutorial"){ dShowTutorial(); return; }
  if (g("data-tut")){
    const k=g("data-tut");
    if (k==="next") dTutStep++;
    else if (k==="back") dTutStep--;
    else { closeSheet(); try{ store.setItem("azsd.tutSeen","1"); }catch(e){} return; }
    $("sheetin").innerHTML = dTutorialSlide(); return;
  }
  if (t.id==="d_begin"){
    if (!dIAmHost()){ toast("Only "+(dungeon.hostName||"the host")+" can start this"); return; }
    dStartScenario(); saveDungeon(); render(); return;
  }
  if (t.id==="d_beginanyway"){
    if (!dIAmHost()){ toast("Only "+(dungeon.hostName||"the host")+" can start this"); return; }
    if (confirm(`Start with only ${dungeon.players.length} players? Anyone who joins after will sit out until the next scenario.`)){
      dStartScenario(); saveDungeon(); render();
    }
    return;
  }
  if (g("data-buy")){
    const mine=myDP(); const kind=g("data-buy"); if((mine.gold||0)<10) return;
    mine.gold-=10; if(kind==="atk") mine.gearAtk=(mine.gearAtk||0)+1; else mine.gearHp=(mine.gearHp||0)+2;
    toast("Bought"); saveDungeon(); render(); return;
  }
  if (t.id==="d_retry"){
    const scn=DSCENARIOS[dungeon.scenarioIndex], n=dungeon.players.length;
    dungeon.monsters=dSpawn(scn,n);
    dungeon.players.forEach(p=>{ p.hand=DCARDS[p.cls].map(c=>c.id); p.discard=[]; p.lost=[]; p.maxHp=dMaxHp(p); p.hp=p.maxHp; p.zone=scn.start; p.shield=0; p.taunt=false; p.ko=false; p.selected=null; p.deck=[]; });
    dungeon.phase="battle"; dungeon.sub="selecting"; dungeon.round=1; dungeon.order=[]; dungeon.turnPtr=0;
    saveDungeon(); render(); return;
  }
  if (g("data-card")){
    const id=g("data-card");
    if (dSel.a===id) dSel.a=null; else if (dSel.b===id) dSel.b=null;
    else if (!dSel.a) dSel.a=id; else if (!dSel.b && id!==dSel.a) dSel.b=id;
    render(); return;
  }
  if (t.id==="d_confirm"){
    const mine=myDP(); const cardA=dCard(mine.cls,dSel.a);
    if (!cardA || !dCard(mine.cls,dSel.b)){ toast("Couldn't read those cards — try again"); dSel={a:null,b:null}; render(); return; }
    mine.selected={a:dSel.a,b:dSel.b,initVal:cardA.init,ready:true};
    mine.hand = mine.hand.filter(id=>id!==dSel.a && id!==dSel.b);
    mine.discard = [...(mine.discard||[]), dSel.a, dSel.b];
    dSel={a:null,b:null};
    saveDungeon(); render(); return;
  }
  if (t.id==="d_unlock"){
    const mine=myDP();
    mine.hand=[...mine.hand, mine.selected.a, mine.selected.b];
    mine.discard=mine.discard.filter(id=>id!==mine.selected.a && id!==mine.selected.b);
    mine.selected=null; saveDungeon(); render(); return;
  }
  if (g("data-rest")){
    const mine=myDP(), kind=g("data-rest");
    if (kind==="short"){
      const lost = mine.discard[Math.floor(Math.random()*mine.discard.length)];
      mine.hand=[...mine.hand, ...mine.discard.filter(id=>id!==lost)];
      mine.lost=[...(mine.lost||[]), lost]; mine.discard=[];
      logD(`<b>${esc(mine.name)}</b> short rests, losing a card`);
    } else {
      mine.hand=[...mine.hand, ...mine.discard]; mine.discard=[];
      mine.hp=Math.min(dMaxHp(mine), mine.hp+2);
      logD(`<b>${esc(mine.name)}</b> long rests and heals 2`);
    }
    mine.selected={ready:true, rest:true};
    saveDungeon(); render(); return;
  }
  if (t.id==="d_startround"){
    dungeon.order = dBuildOrder(); dungeon.turnPtr=0; dungeon.sub="resolving";
    dungeon.players.forEach(p=>{ if(p.selected&&p.selected.rest) p.selected=null; });
    saveDungeon(); render(); return;
  }
  if (g("data-act")){
    if (dBusy) return; dBusy=true;
    const mine=myDP(), scn=dScn(), step=mine._step||"top";
    const card = step==="top" ? dCard(mine.cls,mine.selected.a) : dCard(mine.cls,mine.selected.b);
    if (!card){ mine.selected=null; mine._step=null; dBusy=false; saveDungeon(); render(); return; }
    const action = step==="top" ? card.top : card.bot;
    const val = g("data-act"); const [kind,arg] = val.split("|");
    if (kind==="skip"){ /* no-op */ }
    else if (kind==="self"){ dDoAction(scn, mine, action, null); }
    else if (kind==="move"){ dDoAction(scn, mine, action, +arg); }
    else if (kind==="attack"){ dDoAction(scn, mine, action, arg); }
    else if (kind==="heal"){ dDoAction(scn, mine, action, arg==="self"?"self":arg); }
    if (step==="top"){ mine._step="bot"; }
    else {
      mine._step=null;
      if (!dCheckRoundEnd()){
        dungeon.turnPtr++;
        if (dungeon.turnPtr>=dungeon.order.length) dWrapRound();
      }
    }
    saveDungeon(); dBusy=false; render(); return;
  }
});
function dWrapRound(){
  dungeon.round++;
  dungeon.players.forEach(p=>{
    p.shield=0; p.taunt=false;
    p.selected=null;   // fresh pick every round — without this everyone replays the same two cards forever
    p._step=null;
  });
  dungeon.sub="selecting"; dungeon.order=[]; dungeon.turnPtr=0;
  logD(`Round ${dungeon.round} begins — pick two new cards`);
}

/* ---- monster turns resolve themselves — nobody has to notice and tap a button.
   Only the host's device actually processes a monster's turn, which is what keeps
   multiple phones from racing to act on the same monster — simpler and more reliable
   than the Firebase transaction this used to use, which I was never able to test
   against a live connection from this environment. ---- */
let dAutoTimer = null, dAutoForKey = null, dStallKey = null, dStallSince = 0;
function dTurnKey(){ return dungeon.round+":"+dungeon.turnPtr; }
function dScheduleAutoResolve(){
  if (!dungeon || dungeon.phase!=="battle" || dungeon.sub!=="resolving"){ dClearAutoResolve(); return; }
  const entry = (dungeon.order||[])[dungeon.turnPtr];
  if (!entry || entry.kind!=="monster"){ dClearAutoResolve(); return; }
  const key = dTurnKey();
  /* track how long this monster's turn has been sitting unresolved, so a stuck
     one can be spotted and nudged instead of freezing the game forever */
  if (dStallKey !== key){ dStallKey = key; dStallSince = Date.now(); }
  if (dAutoForKey===key) return;
  dAutoForKey = key;
  clearTimeout(dAutoTimer);
  dAutoTimer = setTimeout(dAutoResolveMonster, 800+Math.random()*700);
}
function dClearAutoResolve(){ clearTimeout(dAutoTimer); dAutoTimer=null; dAutoForKey=null; dStallKey=null; dStallSince=0; }
/* true when a monster's turn has been sitting there far longer than it should —
   usually because the host's phone is asleep or backgrounded, so its timer never fired */
function dMonsterStalled(){
  if (!dungeon || dungeon.phase!=="battle" || dungeon.sub!=="resolving") return false;
  const entry = (dungeon.order||[])[dungeon.turnPtr];
  if (!entry || entry.kind!=="monster") return false;
  return dStallSince && (Date.now() - dStallSince > 6000);
}
function dAutoResolveMonster(){
  const key = dTurnKey();
  if (!dIAmHost()){
    /* not our job — but release the guard so this turn can be retried,
       otherwise a single skipped attempt freezes the game permanently */
    if (dAutoForKey===key) dAutoForKey = null;
    return;
  }
  const entry = (dungeon.order||[])[dungeon.turnPtr];
  if (!entry || entry.kind!=="monster"){ if (dAutoForKey===key) dAutoForKey=null; return; }
  dResolveMonsterNow();
}
/* the actual work, callable by the auto-timer or by a human tapping the nudge button */
function dResolveMonsterNow(){
  const entry = (dungeon.order||[])[dungeon.turnPtr];
  if (!entry || entry.kind!=="monster") return;
  const scn = dScn();
  const m = dungeon.monsters.find(x=>x.id===entry.id);
  if (m && m.alive) dMonsterTurn(scn, m);
  else if (m) logD(`${esc(m.name)} is already down`);
  dungeon.turnPtr++;
  dAutoForKey = null; dStallKey = null; dStallSince = 0;
  if (!dCheckRoundEnd() && dungeon.turnPtr>=dungeon.order.length) dWrapRound();
  saveDungeon(); render();
}

/* ---------- header ---------- */
function renderNow(){
  const {cur,next,now} = current(), s = schedule(), first = s[0];
  if (first && now < first.at){
    const ms=first.at-now, d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, mi=Math.floor(ms/6e4)%60;
    $("countdown").textContent = d>0 ? `Rolling out in ${d} day${d>1?"s":""}, ${h} hr` : `Rolling out in ${h} hr ${mi} min`;
  } else $("countdown").textContent = next ? "" : "That's a wrap.";
  const show = (first && now<first.at) ? first : (next||cur);
  if (!show){ $("now").hidden=true; return; }
  $("now").hidden=false;
  const label = (cur&&show===cur) ? "Happening now" : ((first&&now<first.at) ? "First up" : "Up next");
  $("now").innerHTML = `<div class="lab"><span class="dot"></span>${label}</div>
    <h2>${esc(show.i.title)}</h2>
    <p class="when">${esc(show.i.time)} · ${esc(fullDay(show.d))}</p>` +
    (show.i.place ? `<div class="acts"><a class="btn go" href="${maps(show.i.place.q)}">Open in Maps</a></div>` : "");
}
function renderTabs(){
  $("tabs").innerHTML =
    `<button class="tab ${view==="gaunt"?"on":""}" data-tab="gaunt"><i>⚔️</i><b>Vault</b></button>`
    + plan.days.map(d=>
    `<button class="tab ${view===d.id?"on":""}" data-tab="${d.id}"><i>${d.date.slice(-2)}</i><b>${fullDay(d).slice(0,3)}</b></button>`).join("")
    + `<button class="tab ${view==="quest"?"on":""}" data-tab="quest"><i>🎲</i><b>Quest</b></button>`
    + `<button class="tab ${view==="kit"?"on":""}" data-tab="kit"><i>🎒</i><b>Kit</b></button>`
    + `<button class="tab ${view==="song"?"on":""}" data-tab="song"><i>⚓</i><b>Song</b></button>`;
}

/* ---------- itinerary ---------- */
function renderDay(id){
  const d=day(id), {cur}=current();
  let h = `<p class="rule">${esc(plan.rule)}</p>`;
  d.items.forEach(i=>{
    const isNow = cur&&cur.i.id===i.id, isTbd = i.options&&i.options.length&&!i.place, isOpen = open===i.id;
    h += `<div class="stop ${isNow?"is-now":""} ${i.done?"is-done":""} ${isTbd?"is-tbd":""}">
      <div class="time">${esc(i.time)}</div><div>
      <button class="card" data-open="${i.id}"><h3>${esc(i.title)}</h3>
        ${i.place?`<p class="where">${esc(i.place.name)}</p>`:""}
        ${isTbd?`<span class="badge">Not decided</span>`:""}</button>
      ${isOpen?stopBody(i):""}</div></div>`;

const WCODE = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌦️",61:"🌧️",63:"🌧️",65:"🌧️",80:"🌦️",81:"🌦️",82:"🌧️",95:"⛈️"};
function wIcon(code){ return WCODE[code] || "🌡️"; }
async function fetchWeather(){
  try{
    const url = "https://api.open-meteo.com/v1/forecast?" + new URLSearchParams({
      latitude:"32.7157", longitude:"-117.1611",
      daily:"weathercode,temperature_2m_max,temperature_2m_min",
      timezone:"America/Los_Angeles", start_date:"2026-09-11", end_date:"2026-09-13",
      temperature_unit:"fahrenheit"
    }).toString();
    const res = await fetch(url);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    const days = data.daily.time.map((d,i)=>({
      date:d, hi:Math.round(data.daily.temperature_2m_max[i]), lo:Math.round(data.daily.temperature_2m_min[i]), code:data.daily.weathercode[i]
    }));
    weather = { fetchedAt: Date.now(), days };
    saveWeather();
    if (view==="kit") render();
  } catch(e){ /* keep whatever's cached (or nothing) — fail quiet, this isn't essential */ }
}

}

/* Header photo strip. The header is static markup, so this lives outside
   render()'s innerHTML swap and survives every tab switch — same reason the
   song button keeps playing. It has to be refreshed explicitly from anywhere
   photos change: local posts, and remote Firebase updates. */
let stripAutoTimer = null, stripPausedUntil = 0, stripSig = null;
function renderPhotoStrip(force){
  const el = $("photostrip"); if (!el) return;
  if (!photos.length){ el.hidden = true; el.innerHTML = ""; stripSig = ""; return; }
  const shown = photos.slice(0,20);
  /* Firebase pushes a value event on every write, including ones that change
     nothing here. Rebuilding the row would yank scroll back to the start
     mid-swipe, so only rebuild when the visible set actually differs. */
  const sig = shown.map(p=>p.id).join(",") + "|" + photos.length;
  if (!force && sig === stripSig) return;
  stripSig = sig;
  el.hidden = false;
  el.innerHTML = `<div class="striphead">
      <span class="striplab">Weekend photos</span>
      <span class="stripall">${photos.length}</span>
    </div>
    <div class="striprow" id="striprow">${shown.map((ph,idx)=>
      `<div class="stripitem" data-shot="${idx}">
         <img src="${ph.dataUrl}" alt="${esc(ph.text||"Weekend photo")}">
         <span>${esc(ph.av||"")} ${esc(ph.name||"")}</span>
       </div>`).join("")}</div>`;
  const row = $("striprow");
  /* any touch or manual scroll pauses the drift, so it never fights the user */
  const pause = ()=>{ stripPausedUntil = Date.now() + 12000; };
  row.addEventListener("touchstart", pause, {passive:true});
  row.addEventListener("pointerdown", pause);
  row.addEventListener("wheel", pause, {passive:true});
  if (stripAutoTimer) clearInterval(stripAutoTimer);
  if (shown.length > 1){
    stripAutoTimer = setInterval(()=>{
      const r = $("striprow"); if (!r) return;
      if (Date.now() < stripPausedUntil) return;
      if (document.hidden) return;
      const step = 96; /* one tile + gap */
      const atEnd = r.scrollLeft + r.clientWidth >= r.scrollWidth - 4;
      r.scrollTo({left: atEnd ? 0 : r.scrollLeft + step, behavior:"smooth"});
    }, 4000);
  }
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-open],[data-pick],[data-done],[data-edit],[data-add],[data-up],[data-down],[data-copy],[data-kit],[data-cls],[data-av],[data-res],[data-shot],#addkit,#copyplan,#resetplan,#editoff,#roll,#j_go,#resetgame,#clearphotos,#addphoto,#addphotohdr,.photohint,#d_applyupdate,#forceupdate");
  if (!t) return; const g = n=>t.getAttribute(n);

  if (t.id==="d_applyupdate"){ dApplyUpdate(); return; }
  if (g("data-tab")){ view=g("data-tab"); open=null; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if (g("data-open")){ open = open===g("data-open")?null:g("data-open"); render(); return; }
  if (g("data-copy")){ copy(g("data-copy")); return; }
  if (g("data-pick")){ const [iid,oi]=g("data-pick").split("|"); const it=find(iid), o=it.options[+oi];
    it.place = (it.place&&it.place.name===o.name) ? null : {name:o.name, q:o.q||o.name+" San Diego"};
    savePlan(); render(); toast(it.place?"Locked in":"Unpicked"); return; }
  if (g("data-done")){ const it=find(g("data-done")); it.done=!it.done; savePlan(); render(); return; }
  if (g("data-edit")){ editStop(g("data-edit")); return; }
  if (g("data-add")){ addStop(g("data-add")); return; }
  if (g("data-up")||g("data-down")){
    const id=g("data-up")||g("data-down"), dir=g("data-up")?-1:1;
    const d=plan.days.find(d=>d.items.some(i=>i.id===id)); const idx=d.items.findIndex(i=>i.id===id), to=idx+dir;
    if (to>=0&&to<d.items.length){ const [m]=d.items.splice(idx,1); d.items.splice(to,0,m); savePlan(); render(); } return; }
  if (g("data-kit")){ plan.kit[+g("data-kit")].done = !plan.kit[+g("data-kit")].done; savePlan(); render(); return; }
  if (t.id==="forceupdate"){
    t.classList.add("spinning");
    toast("Fetching the latest…");
    setTimeout(dApplyUpdate, 400);
    return;
  }
  if (t.id==="addkit"){ const v=prompt("Add to the store list"); if(v){ plan.kit.push({text:v,done:false}); savePlan(); render(); } return; }
  if (t.id==="editoff"){ editing=false; render(); return; }
  if (t.id==="resetplan"){ if(confirm("Throw away your edits and go back to the published plan?")){
      plan=JSON.parse(JSON.stringify(PUBLISHED)); savePlan(); render(); toast("Back to published"); } return; }
  if (t.id==="copyplan"){ copy("const PUBLISHED = "+JSON.stringify(cleanPlan(plan),null,2)+";", "Plan copied — paste it into GitHub"); return; }

  /* game */
  if (g("data-cls")){ if(t.classList.contains("full")) return; [...t.parentNode.children].forEach(b=>b.classList.remove("on")); t.classList.add("on"); return; }
  if (g("data-av")){ [...t.parentNode.children].forEach(b=>b.classList.remove("on")); t.classList.add("on"); return; }
  if (t.id==="j_go"){
    const name = ($("j_name").value||"").trim();
    if (!name){ toast("Name first"); return; }
    const cls = $("j_class").querySelector(".on").getAttribute("data-cls");
    if ((qClassCounts()[cls]||0) >= CLASS_CAP){ toast(CLASSES[cls].n+" just filled up — pick another class"); render(); return; }
    const av  = $("j_av").querySelector(".on").getAttribute("data-av");
    joinGame(name, cls, av); toast("You're in"); return;
  }
  if (t.id==="roll"){ rollTurn(); return; }
  if (g("data-res")){
    const ok = g("data-res")==="1";
    if (ok && game.card && (game.card.kind==="quest" || game.card.kind==="boss")){ showPhotoPrompt(); return; }
    resolveCard(ok); return;
  }
  if (t.id==="addphotohdr" || t.classList.contains("photohint")){ showStandalonePhotoPrompt(); return; }
  if (g("data-shot")!==null){ openShot(+g("data-shot")); return; }
  if (t.id==="addphoto"){ showStandalonePhotoPrompt(); return; }
  if (t.id==="clearphotos"){ if(confirm("Clear all the highlight photos? This can't be undone.")){ photos=[]; savePhotos(); render(); } return; }
  if (t.id==="resetgame"){ if(confirm("Start a new quest? Characters are wiped.")){ game=newGame(); saveGame(); render(); } return; }
});
document.addEventListener("input", e=>{

function copy(txt,msg){
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast(msg||"Copied"));
  else { const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
         document.execCommand("copy"); ta.remove(); toast(msg||"Copied"); }
}
function cleanPlan(p){ const c=JSON.parse(JSON.stringify(p));
  c.days.forEach(d=>d.items.forEach(i=>{ delete i.done; })); c.kit=c.kit.map(k=>k.text||k); return c; }

/* ---------- add / edit sheet ---------- */
function sheet(h){ $("sheetin").innerHTML=h; $("sheet").hidden=false; }
function closeSheet(){ $("sheet").hidden=true; }

function form(it){
  return `<h3>${it.id?"Edit stop":"New stop"}</h3>
  <label for="f_time">Time</label><input id="f_time" value="${esc(it.time||"")}" placeholder="6:00 PM">
  <label for="f_title">What's happening</label><input id="f_title" value="${esc(it.title||"")}" placeholder="Dinner">
  <label for="f_note">Details</label><textarea id="f_note">${esc(it.note||"")}</textarea>
  <label for="f_pname">Place name</label><input id="f_pname" value="${esc(it.place?it.place.name:"")}" placeholder="STK Steakhouse">
  <label for="f_pq">Address for Maps</label><input id="f_pq" value="${esc(it.place?it.place.q:"")}" placeholder="600 F St, San Diego, CA">
  <div class="row"><button class="btn ghost" id="f_cancel">Cancel</button><button class="btn solid" id="f_save">Save changes</button></div>
  ${it.id?`<div class="row"><button class="btn warn" id="f_del">Delete this stop</button></div>`:""}`;
}
function wire(onSave,onDel){
  $("f_cancel").onclick = closeSheet;
  $("f_save").onclick = ()=>{
    const v={time:$("f_time").value.trim(),title:$("f_title").value.trim(),note:$("f_note").value.trim(),
             pname:$("f_pname").value.trim(),pq:$("f_pq").value.trim()};
    if(!v.title){ toast("Give it a name first"); return; }
    onSave(v); closeSheet(); savePlan(); render();
  };
  if ($("f_del")) $("f_del").onclick = ()=>{ if(confirm("Delete this stop?")){ onDel(); closeSheet(); savePlan(); render(); } };
}
function editStop(id){ const it=find(id); sheet(form(it));
  wire(v=>{ it.time=v.time; it.title=v.title; it.note=v.note;
            it.place = v.pname?{name:v.pname,q:v.pq||v.pname}:null; toast("Saved"); },
       ()=>{ const d=plan.days.find(d=>d.items.some(i=>i.id===id));
             d.items=d.items.filter(i=>i.id!==id); open=null; toast("Deleted"); }); }
function addStop(dayId){ sheet(form({}));
  wire(v=>{ const d=day(dayId);
    d.items.push({id:uid(),time:v.time||"12:00 PM",title:v.title,note:v.note,
                  place:v.pname?{name:v.pname,q:v.pq||v.pname}:null});
    d.items.sort((a,b)=>(when(d.date,a.time)||0)-(when(d.date,b.time)||0)); toast("Stop added"); }); }

/* small header Easter egg — no timeline, no autoplay, just a play/pause toggle.
   The header markup is static (render() only touches #main/#tabs), so this
   button and the audio element are never recreated when switching tabs —
   playback naturally keeps going undisturbed. */

/* ---- Karaoke timing ----
   These marks are measured off the actual recording, not guessed from the
   track length. The shanty runs on a steady 2.288s line (four beats at
   ~105 BPM); the vocal enters at 0.23s, and there's a four-line instrumental
   break between the third chorus and the last verse (55.1s -> 64.3s) which
   the old "divide the whole file by 32" estimate knew nothing about — that
   gap alone is what used to push the words a full verse ahead of the singing.
   Singing ends at ~82.6s and the rest of the file is the outro.
   To nudge a line, edit its `s` (seconds into the track). */
const SONG_LEN = 98.4;   /* length the marks below were measured against */
const LEAD_IN  = 0.25;   /* light a line up a beat early so you can catch it */
const LYRICS = [
  {v:1},
  {i:0,s:0.23,t:"Oh we sailed our crew to San Diego town,",k:"lead"},
  {i:1,s:2.52,t:"Way, hay, Matty-o!",k:"resp"},
  {i:2,s:4.81,t:"To give our boy his last go-round,",k:"lead"},
  {i:3,s:7.09,t:"'Fore he's a married man-o!",k:"resp"},
  {c:1},
  {i:4,s:9.38,t:"Heave away, you Phatty crew,",k:"ch"},
  {i:5,s:11.67,t:"Pour the rum and drink on through,",k:"ch"},
  {i:6,s:13.96,t:"We'll walk him home by morning too,",k:"ch"},
  {i:7,s:16.25,t:"Before he says \"I do-o!\"",k:"ch"},
  {v:2},
  {i:8,s:18.53,t:"We hit the cellar, stormed the pool,",k:"lead"},
  {i:9,s:20.82,t:"Way, hay, Matty-o!",k:"resp"},
  {i:10,s:23.11,t:"Hodad's burgers, breaking rules,",k:"lead"},
  {i:11,s:25.40,t:"'Fore he's a married man-o!",k:"resp"},
  {c:1},
  {i:12,s:27.69,t:"Heave away, you Phatty crew,",k:"ch"},
  {i:13,s:29.97,t:"Pour the rum and drink on through,",k:"ch"},
  {i:14,s:32.26,t:"We'll walk him home by morning too,",k:"ch"},
  {i:15,s:34.55,t:"Before he says \"I do-o!\"",k:"ch"},
  {v:3},
  {i:16,s:36.84,t:"We climbed the bells, we crawled the bars,",k:"lead"},
  {i:17,s:39.13,t:"Way, hay, Matty-o!",k:"resp"},
  {i:18,s:41.41,t:"Gaslamp lit up like the stars,",k:"lead"},
  {i:19,s:43.70,t:"'Fore he's a married man-o!",k:"resp"},
  {c:1},
  {i:20,s:45.99,t:"Heave away, you Phatty crew,",k:"ch"},
  {i:21,s:48.28,t:"Pour the rum and drink on through,",k:"ch"},
  {i:22,s:50.57,t:"We'll walk him home by morning too,",k:"ch"},
  {i:23,s:52.85,t:"Before he says \"I do-o!\"",k:"ch"},
  {brk:1,s:55.14},  /* bars 25-28: instrumental break, nobody sings */
  {v:4},
  {i:24,s:64.29,t:"So here's to Matt, and here's to love,",k:"lead"},
  {i:25,s:66.58,t:"Way, hay, Matty-o!",k:"resp"},
  {i:26,s:68.87,t:"The brotherhood's still up above,",k:"lead"},
  {i:27,s:71.16,t:"'Fore he's a married man-o!",k:"resp"},
  {c:2},
  {i:28,s:73.45,t:"Heave away, you Phatty crew,",k:"ch"},
  {i:29,s:75.73,t:"Pour the rum and drink on through,",k:"ch"},
  {i:30,s:78.02,t:"We'll walk him home by morning too,",k:"ch"},
  {i:31,s:80.31,t:"Before he says — \"I DO!\"",k:"ch"}
];
/* flat list of sung lines in track order, for the sync loop */
const KCUES = LYRICS.filter(r=>r.s!==undefined);
function renderKaraoke(){
  let html = `<div class="karaoke" id="karaoke">`;
  LYRICS.forEach(row=>{
    if (row.v) html += `<p class="klabel">Verse ${row.v}</p>`;
    else if (row.c===1) html += `<p class="klabel">Chorus — everybody</p>`;
    else if (row.c===2) html += `<p class="klabel">Final chorus — arms around shoulders</p>`;
    else if (row.brk) html += `<p class="kline kbreak" data-i="brk">⚓ Instrumental break — catch your breath</p>`;
    else html += `<p class="kline k-${row.k}" data-i="${row.i}">${esc(row.t)}</p>`;
  });
  html += `</div>`;
  return html;
}
/* which cue is live at time `tt`; -1 before the first word */
function kCueAt(tt){
  let lo=0, hi=KCUES.length-1, at=-1;
  while (lo<=hi){ const mid=(lo+hi)>>1;
    if (KCUES[mid].s <= tt){ at=mid; lo=mid+1; } else hi=mid-1; }
  return at;
}
function openKaraoke(){
  sheet(`<div class="krow"><h3>🎤 Sing along</h3><button class="kclose" id="kclose" aria-label="Close lyrics">✕</button></div>
    ${renderKaraoke()}
    <p class="note" style="margin-top:10px">Lines are timed to the recording — the highlight lands a beat before each line so you can jump in on the downbeat.</p>`);
  $("kclose").onclick = closeSheet;
  const audio = document.getElementById("bachelorSong");
  const box = $("karaoke");
  let lastKey = null;
  /* only the newest popup drives the highlight — reopening never stacks loops */
  const myRun = (openKaraoke.run = (openKaraoke.run||0) + 1);
  function show(el){
    if (!el || !box) return;
    /* scroll the lyric box itself (never the whole sheet), and only when the
       line has drifted out of the comfortable middle of the view */
    const top = el.offsetTop - box.offsetTop, mid = top - (box.clientHeight - el.offsetHeight)/2;
    if (Math.abs(box.scrollTop - mid) > box.clientHeight*0.28)
      box.scrollTo({top:mid, behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth"});
  }
  function paint(key){
    box.querySelectorAll(".kline.active,.kline.next").forEach(el=>el.classList.remove("active","next"));
    if (key === null) return;
    const cur = box.querySelector(`.kline[data-i="${key}"]`);
    if (cur){ cur.classList.add("active"); show(cur); }
    const at = KCUES.findIndex(r=>(r.brk?"brk":String(r.i))===String(key));
    const nxt = at>=0 && KCUES[at+1];
    if (nxt){
      const el = box.querySelector(`.kline[data-i="${nxt.brk?"brk":nxt.i}"]`);
      if (el) el.classList.add("next");
    }
  }
  function tick(){
    if ($("sheet").hidden || openKaraoke.run !== myRun) return; /* closed or superseded — let the loop die */
    /* if the file is ever re-encoded to a different length, stretch the marks
       to match instead of drifting further with every line */
    const dur = (audio.duration && isFinite(audio.duration) && audio.duration>1) ? audio.duration : SONG_LEN;
    const tt = audio.currentTime * (SONG_LEN/dur) + LEAD_IN;
    const at = kCueAt(tt);
    const key = at<0 ? null : (KCUES[at].brk ? "brk" : String(KCUES[at].i));
    if (key !== lastKey){ lastKey = key; paint(key); }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function initSongToggle(){
  const btn = document.getElementById("songToggle");
  const audio = document.getElementById("bachelorSong");
  if (!btn || !audio) return;
  const playIcon = btn.querySelector(".ic-play"), pauseIcon = btn.querySelector(".ic-pause");
  btn.addEventListener("click", ()=>{
    if (audio.paused) audio.play().catch(()=>{});
    else audio.pause();
  });
  audio.addEventListener("play", ()=>{
    playIcon.style.display="none"; pauseIcon.style.display="";
    btn.setAttribute("aria-label","Pause bachelor party song");
    btn.setAttribute("aria-pressed","true");
    btn.classList.add("playing");
    openKaraoke();
  });
  audio.addEventListener("pause", ()=>{
    playIcon.style.display=""; pauseIcon.style.display="none";
    btn.setAttribute("aria-label","Play bachelor party song");
    btn.setAttribute("aria-pressed","false");
    btn.classList.remove("playing");
  });
  audio.addEventListener("ended", ()=>{ audio.currentTime = 0; });
}

(function(){
  render(); initSync(); fetchWeather(); setInterval(renderNow, 30000);
  initSongToggle();

})();
