<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AddyZaddySyrupDaddy — Phatty Weekend</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phatty Weekend">
<meta name="theme-color" content="#0A161E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10202B; --ink-deep:#0A161E; --ink-line:#1E3140;
  --sand:#F2E6D2; --kelp:#7D97A6; --syrup:#E8A33D; --sunset:#E2604A; --go:#3FA98A; --r:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--sand);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;
     font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:none}
h1,h2,h3,h4{margin:0;font-weight:600}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#updatebanner:empty{display:none}
.updatebar{background:var(--syrup);color:#14252F;padding:10px 16px;text-align:center;font-weight:700;font-size:13.5px;cursor:pointer;position:sticky;top:0;z-index:50}
.updatebar small{display:block;font-weight:600;opacity:.8;font-size:11.5px;margin-top:1px}
a{color:var(--syrup)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

header{background:var(--ink-deep);border-bottom:1px solid var(--ink-line);padding:calc(env(safe-area-inset-top) + 22px) 0 18px}
.mark{font-family:Anton,Haettenschweiler,Impact,sans-serif;font-weight:400;line-height:.86;
      letter-spacing:-.01em;font-size:clamp(34px,10.5vw,54px);text-transform:uppercase}
.mark span{display:block}.mark .l2{color:var(--syrup)}.mark .l3{color:var(--sunset)}
/* Play + refresh ride in a right-aligned row under the countdown, and the "+"
   sits at the left of the photo bar. Both are in the normal flow rather than
   absolutely positioned: stacked and absolute, each was offset by the notch
   inset on top of the header padding that already included it, so on any phone
   with a safe area the column slid ~50px lower than the text did and the "+"
   landed on the "Up next" card. In the flow they simply can't overlap. */
.hdrbtns{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:12px}
.photobar{display:flex;align-items:center;gap:12px;margin-top:14px}
.photobar .plusbtn{flex:none}
/* prompt that stands in for the strip before anyone has posted anything —
   the strip hides itself when empty, so the "+" would otherwise sit alone */
.photohint{color:var(--kelp);font-size:13px;line-height:1.3;cursor:pointer}
#photostrip:not([hidden]) ~ .photohint{display:none}
.songbtn{width:44px;height:44px;border-radius:50%;background:var(--ink);
  border:1.5px solid var(--syrup);color:var(--sand);flex:none;
  display:flex;align-items:center;justify-content:center}
.songbtn .ic-play{margin-left:2px}
.songbtn:active{transform:scale(.94)}
.refreshbtn{opacity:.75;border-color:var(--kelp)}
.plusbtn{border-color:var(--syrup)}
.strip{flex:1;min-width:0}
.strip .striphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.strip .striplab{color:var(--kelp);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.strip .stripall{color:var(--syrup);font-size:12px;font-weight:600}
.striprow{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x mandatory;padding-bottom:2px}
.striprow::-webkit-scrollbar{display:none}
.stripitem{flex:0 0 auto;scroll-snap-align:start;position:relative;width:88px}
.stripitem img{width:88px;height:88px;object-fit:cover;border-radius:8px;display:block;
  border:1px solid var(--ink-line);background:var(--ink)}
.stripitem span{display:block;color:var(--kelp);font-size:10.5px;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refreshbtn.spinning svg{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){
  .songbtn.playing{animation:songpulse 1.8s ease-out infinite}
}
@keyframes songpulse{
  0%{box-shadow:0 0 0 0 rgba(232,163,61,.45)}
  70%{box-shadow:0 0 0 9px rgba(232,163,61,0)}
  100%{box-shadow:0 0 0 0 rgba(232,163,61,0)}
}
.dates{color:var(--kelp);font-size:13.5px;margin-top:10px}
.countdown{color:var(--sand);font-size:13.5px;margin-top:2px}
.now{margin-top:16px;background:#132A38;border:1px solid var(--ink-line);border-left:3px solid var(--sunset);
     border-radius:var(--r);padding:14px}
.now .lab{display:flex;align-items:center;gap:7px;color:var(--kelp);font-size:12.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sunset);flex:none}
@media (prefers-reduced-motion:no-preference){.dot{animation:p 2.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}}
.now h2{font-size:19px;margin:5px 0 2px;line-height:1.25}
.now .when{color:var(--syrup);font-size:14px;font-variant-numeric:tabular-nums}

nav{position:sticky;top:0;z-index:40;background:rgba(10,22,30,.94);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ink-line)}
.tabs{display:flex;max-width:640px;margin:0 auto;padding:7px 5px;gap:3px}
.tab{flex:1;min-width:0;padding:9px 1px 8px;text-align:center;border-radius:9px;color:var(--kelp);overflow:hidden}
.tab i{display:block;font-style:normal;font-size:18px;line-height:1.15;font-weight:700}
.tab b{display:block;font-weight:700;font-size:11.5px;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.tab.on{color:#14252F;background:var(--syrup)}

main{padding:18px 0 40px}
.rule{color:var(--kelp);font-size:13px;line-height:1.5;border-left:2px solid var(--ink-line);padding-left:12px;margin:0 0 20px}
.stop{display:grid;grid-template-columns:70px 1fr;gap:12px;position:relative;padding-bottom:16px}
.stop::before{content:"";position:absolute;left:78px;top:24px;bottom:0;width:1px;background:var(--ink-line)}
.stop:last-of-type::before{display:none}
.time{text-align:right;color:var(--syrup);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:11px;position:relative}
.time::after{content:"";position:absolute;right:-13px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--ink-line)}
.stop.is-now .time::after{background:var(--sunset);border-color:var(--sunset)}
.stop.is-done .time{color:var(--kelp)}
.stop.is-done .time::after{background:var(--go);border-color:var(--go)}
.card{background:#14252F;border:1px solid var(--ink-line);border-radius:var(--r);padding:11px 13px;width:100%;text-align:left;display:block}
.stop.is-now .card{border-color:var(--sunset)}
.stop.is-tbd .card{border-left:3px solid var(--syrup)}
.card h3{font-size:16.5px;line-height:1.3}
.stop.is-done .card h3{color:var(--kelp);text-decoration:line-through}
.where{color:var(--kelp);font-size:13.5px;margin-top:3px}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--syrup);border:1px solid var(--syrup);border-radius:2px;padding:1px 5px;margin-top:7px}
.body{padding:2px 0 4px}
.note{color:var(--kelp);font-size:14px;margin:9px 0 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.btn{border:1px solid var(--ink-line);border-radius:var(--r);padding:11px 14px;font-size:14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.go{background:var(--sunset);border-color:var(--sunset);color:#fff;flex:1}
.btn.solid{background:var(--syrup);border-color:var(--syrup);color:#14252F}
.btn.ghost{color:var(--kelp)}
.btn.warn{color:var(--sunset);border-color:var(--sunset)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4}
/* Photo picking: the file input itself stays visually hidden and a label
   stands in for it, so tapping the label opens the phone's own picker —
   Photo Library / Take Photo / Choose File. (Don't put `capture` back on the
   input: it skips that menu and forces the camera, which is exactly what
   stopped anyone posting a shot they'd already taken.) */
.filein{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.filebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:100%;margin-top:12px;padding:13px 14px;border:1.5px dashed var(--syrup);
  border-radius:var(--r);color:var(--syrup);font-size:15px;font-weight:700;
  line-height:1.3;text-align:center;min-height:56px;cursor:pointer}
.filein:focus-visible + .filebtn{outline:2px solid var(--syrup);outline-offset:2px}
.filebtn small{color:var(--kelp);font-size:12px;font-weight:400}
.filebtn.has{border-style:solid;border-color:var(--ink-line);color:var(--sand)}
.ideas{margin-top:13px;border-top:1px solid var(--ink-line);padding-top:11px}
.ideas .lab{color:var(--kelp);font-size:12.5px;margin-bottom:8px}
.idea{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--ink-line)}
.idea:last-child{border-bottom:none}
.idea .nm{flex:1;font-size:14.5px}
.idea .nm small{display:block;color:var(--kelp);font-size:12.5px;font-weight:400}
.idea.picked .nm{color:var(--go)}
.pick{border:1px solid var(--ink-line);border-radius:2px;padding:6px 10px;font-size:12.5px;color:var(--kelp);flex:none}
.idea.picked .pick{border-color:var(--go);color:var(--go)}
.mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.mini button{font-size:13px;color:var(--kelp);border:1px solid var(--ink-line);border-radius:var(--r);padding:9px 12px;min-height:40px}
.addstop{width:100%;margin-top:6px;border:1px dashed var(--ink-line);border-radius:var(--r);padding:14px;color:var(--kelp);font-size:14px}

.panel{background:#14252F;border:1px solid var(--ink-line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.panel h3{font-size:16px;margin-bottom:4px}
.panel p{color:var(--kelp);font-size:13.5px;margin:4px 0 0}
.chk{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--ink-line);width:100%;text-align:left;font-size:14.5px}
.chk:last-child{border-bottom:none}
.box{width:21px;height:21px;border:1.5px solid var(--kelp);border-radius:3px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink)}
.chk.on .box{background:var(--go);border-color:var(--go)}
.chk.on span{color:var(--kelp);text-decoration:line-through}
textarea,input,select{width:100%;background:var(--ink);border:1px solid var(--ink-line);border-radius:var(--r);
  color:var(--sand);padding:11px;font:inherit;font-size:16px;margin-top:8px}
textarea{min-height:88px;resize:vertical}
label{display:block;color:var(--kelp);font-size:12.5px;margin-top:12px}
.dec{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ink-line);font-size:14.5px}
.dec:last-child{border-bottom:none}
.dec b{font-weight:600;color:var(--kelp)}
.dec span{text-align:right}

/* ---------- quest ---------- */
.hero-q{background:#132A38;border:1px solid var(--ink-line);border-radius:var(--r);padding:16px;margin-bottom:16px;text-align:center}
.hero-q .who{color:var(--kelp);font-size:13px}
.hero-q h2{font-family:Anton,Impact,sans-serif;font-size:30px;text-transform:uppercase;letter-spacing:.01em;margin:6px 0 10px;line-height:1}
.die{font-family:Anton,Impact,sans-serif;font-size:64px;line-height:1;color:var(--syrup);font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:14px 0}
.tile{aspect-ratio:1;border:1px solid var(--ink-line);border-radius:3px;background:#14252F;display:flex;
      flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--kelp);position:relative;padding:2px}
.tile.t-quest{border-color:#2C4B5E}.tile.t-tavern{border-color:var(--syrup)}
.tile.t-trap{border-color:var(--sunset)}.tile.t-boss{background:var(--sunset);border-color:var(--sunset);color:#fff}
.tile.t-finish{background:var(--syrup);border-color:var(--syrup);color:#14252F}
.tile .toks{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;font-size:14px}
.lb{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ink-line)}
.lb:last-child{border-bottom:none}
.lb .av{font-size:22px;width:30px;text-align:center}
.lb .nm{flex:1}
.lb .nm small{display:block;color:var(--kelp);font-size:12.5px}
.lb .sc{color:var(--syrup);font-weight:700;font-variant-numeric:tabular-nums}
.lb.turn .nm{color:var(--syrup)}
.log{font-size:13.5px;color:var(--kelp);border-bottom:1px solid var(--ink-line);padding:9px 0}
.log:last-child{border-bottom:none}
.log b{color:var(--sand);font-weight:600}
.drawn{background:var(--ink-deep);border:1px solid var(--syrup);border-radius:var(--r);padding:14px;margin-top:14px}
.drawn .kind{color:var(--syrup);font-size:12.5px}
.drawn h4{font-size:17px;margin:6px 0 6px;line-height:1.3}
.drawn p{color:var(--kelp);font-size:14px;margin:0}
.pill{display:inline-block;border:1px solid var(--ink-line);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--kelp);margin:8px 6px 0 0}
.classpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.classpick button{border:1px solid var(--ink-line);border-radius:var(--r);padding:11px 8px;text-align:left;font-size:14px}
.classpick button.on{border-color:var(--syrup);color:var(--syrup)}
.classpick button.full{opacity:.4}
.classpick button[disabled]{pointer-events:none}
.classpick small{display:block;color:var(--kelp);font-size:11.5px;font-weight:400}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.emojis button{font-size:22px;padding:7px 9px;border:1px solid var(--ink-line);border-radius:var(--r)}
.emojis button.on{border-color:var(--syrup);background:#132A38}
.mode{font-size:12.5px;color:var(--kelp);text-align:center;margin-top:14px}

/* ---------- gauntlet ---------- */
.hpbar{height:8px;background:var(--ink-line);border-radius:99px;overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:var(--go)}
.hpbar.low i{background:var(--sunset)}
.mcard{background:var(--ink-deep);border:1px solid var(--ink-line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.mcard.dead{opacity:.4}
.mcard .mn{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:600}
.mcard .mn small{display:block;color:var(--kelp);font-weight:400;font-size:12px}
.handgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hcard{border:1px solid var(--ink-line);border-radius:var(--r);padding:10px;text-align:left;font-size:13px;background:var(--ink-deep)}
.hcard .hn{font-weight:600;font-size:14px;display:flex;justify-content:space-between}
.hcard .hi{color:var(--syrup);font-variant-numeric:tabular-nums}
.hcard .ht,.hcard .hb{color:var(--kelp);margin-top:4px;font-size:12.5px}
.hcard.selA{border-color:var(--syrup)}
.hcard.selB{border-color:var(--sunset)}
.turnbanner{background:#132A38;border:1px solid var(--sunset);border-left:3px solid var(--sunset);border-radius:var(--r);padding:14px;margin-bottom:14px;text-align:center}
.turnbanner h2{font-family:Anton,Impact,sans-serif;font-size:23px;text-transform:uppercase;letter-spacing:.01em}
.targetlist h4{color:var(--go);font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px;display:flex;align-items:center;gap:6px}
.targetlist h4.atk{color:var(--sunset)}
.targetlist button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
  border:2px solid var(--go);border-radius:var(--r);padding:14px 16px;margin-top:10px;font-size:15.5px;font-weight:700;
  background:#153320;color:var(--sand)}
.targetlist button.atk{border-color:var(--sunset);background:#331815}
.targetlist button .chev{font-size:19px;opacity:.6;flex:none}
.targetlist button:active{transform:translateY(1px)}

/* ---------- phase banner + turn order ---------- */
.phasebar{background:#132A38;border:1px solid var(--ink-line);border-left:3px solid var(--syrup);border-radius:var(--r);
  padding:11px 13px;margin-bottom:14px;font-size:13.5px;font-weight:700;color:var(--sand);display:flex;align-items:center;gap:9px}
.dot2{width:7px;height:7px;border-radius:50%;background:var(--syrup);flex:none}
@media (prefers-reduced-motion:no-preference){ .dot2{animation:p 2.4s ease-in-out infinite} }
.orderrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-top:8px;-webkit-overflow-scrolling:touch}
.ochip{flex:none;background:var(--ink-deep);border:1px solid var(--ink-line);border-radius:99px;padding:7px 12px;font-size:12.5px;white-space:nowrap;color:var(--kelp)}
.ochip.now{border-color:var(--syrup);color:var(--sand);font-weight:700}
.ochip.done{opacity:.4;text-decoration:line-through}

/* ---------- weather ---------- */
.wxrow{display:flex;gap:10px;margin-top:10px}
.wxday{flex:1;text-align:center;background:var(--ink-deep);border:1px solid var(--ink-line);border-radius:var(--r);padding:11px 6px}
.wxd{color:var(--kelp);font-size:12px;font-weight:600;margin:0}
.wxi{font-size:23px;margin:5px 0}
.wxt{font-size:14px;font-weight:700;color:var(--sand);margin:0}
.wxt span{color:var(--kelp);font-weight:400;font-size:12px}

/* ---------- shanty ---------- */
.shanty{margin-top:10px}
.shanty .versenum{color:var(--sunset);font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;margin:22px 0 2px;padding-top:14px;border-top:1px dashed var(--ink-line)}
.shanty .versenum:first-child{margin-top:0;padding-top:0;border-top:none}
.shanty .lead{color:var(--sand);font-size:14.5px;margin:10px 0 2px}
.shanty .lead b{color:var(--kelp);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.02em}
.shanty .resp{color:var(--syrup);font-size:16px;font-weight:700;margin:0 0 4px 14px}
.shanty .chorus{background:var(--ink-deep);border:1px solid var(--syrup);border-radius:var(--r);
  padding:12px 14px;margin:14px 0;font-size:15px;font-weight:700;color:var(--sand);line-height:1.6}
.shanty .chorus b{display:block;color:var(--syrup);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.shanty .chorus.big{border-width:2px;border-color:var(--sunset)}
.shanty .chorus.big b{color:var(--sunset)}
.krow{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.kclose{width:32px;height:32px;border-radius:50%;background:var(--ink);border:1px solid var(--ink-line);
  color:var(--kelp);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.karaoke{max-height:52vh;overflow-y:auto;margin-top:6px;padding-right:2px;
  /* tail room so the last chorus can still sit mid-box instead of pinned
     to the bottom edge when the song is winding up */
  padding-bottom:120px}
.klabel{color:var(--sunset);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  margin:18px 0 4px;padding-top:10px;border-top:1px dashed var(--ink-line)}
.klabel:first-child{margin-top:0;padding-top:0;border-top:none}
.kline{color:var(--kelp);font-size:15px;margin:5px 0;padding:4px 8px;border-radius:6px;
  transition:color .2s,background-color .2s,transform .2s}
.kline.k-resp{font-weight:700}
.kline.active{color:var(--sand);background:var(--ink);font-weight:700;transform:scale(1.02)}
.kline.k-resp.active{color:var(--syrup)}
/* the line you're about to sing, so nobody comes in cold */
.kline.next{color:var(--sand);opacity:.72}
.kbreak{color:var(--kelp);font-style:italic;font-size:13px;opacity:.75}

  let h=+m[1]%12; if(/pm/i.test(m[3])) h+=12; const [y,mo,da]=d.split("-").map(Number);

/* Firebase throws immediately on any `undefined` value anywhere in the object,
   which localStorage silently tolerates — so state that saved fine locally could
   blow up the moment it synced. Round-tripping through JSON drops undefined the
   same way localStorage does, giving Firebase something it will always accept. */
function fbSafe(obj){
  try { return JSON.parse(JSON.stringify(obj)); }
  catch(e){ return obj; }
}
function fbWrite(ref, data, label){
  if (!syncOn || !ref) return;
  try {
    ref.set(fbSafe(data)).catch(err=>{
      dSyncError = label+" failed to save: "+(err && err.message ? err.message : "unknown");
      render();
    });
  } catch(err){
    dSyncError = label+" rejected: "+(err && err.message ? err.message : String(err));
    render();
  }
}

   until the whole deck's been seen once, same trick as the Gauntlet's modifier deck ---- */
function shuffleG(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function drawCard(kind){

  if (!game.decks[kind] || !game.decks[kind].length) game.decks[kind] = shuffleG(DECK[kind].map((_,i)=>i));
  return DECK[kind][game.decks[kind].pop()];
}

      img.onload = ()=>{
        const maxDim = 720; let w=img.width, h=img.height;
        if (w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if (h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        resolve(cv.toDataURL("image/jpeg",0.55));
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

/* Firebase — both games share one project, different paths so they never collide:
   games/{ROOM}/quest   -> the board game
   games/{ROOM}/dungeon -> the Groom's Gauntlet campaign */
let dSyncToastShown = false, dSyncStage = "starting", dSyncError = "";
/* until we have actually received the server's copy of the game once, this device
   must not push its own state — otherwise a page refresh can race and overwrite
   a live game with whatever stale/empty copy this browser happened to have */
let dSeenServer = false, gSeenServer = false;
function initSync(){
  try {
    if (!FIREBASE_CONFIG) return;
    /* must use typeof — a bare `firebase` reference throws ReferenceError before
       the SDK has loaded, which silently killed this whole function on first run */
    if (typeof firebase !== "undefined" && firebase.apps && firebase.apps.length && syncOn) return;
    dSyncStage = "loading Firebase";
    const load = src => new Promise((res,rej)=>{
      const s=document.createElement("script"); s.src=src;
      s.onload=res;
      s.onerror=()=>rej(new Error("could not download "+src.split("/").pop()));
      document.head.appendChild(s);
    });
    const loadBoth = () => load("https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js")
      .then(()=>load("https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"));
    const attempt = (n) => loadBoth().catch(err => {
      if (n<3){ dSyncStage="retrying script load ("+n+"/3)"; return new Promise(r=>setTimeout(r,1200)).then(()=>attempt(n+1)); }
      throw err;
    });
    attempt(1)
      .then(()=>{
        dSyncStage = "connecting to database";
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        fbRef = firebase.database().ref("games/"+ROOM+"/quest");
        dRef  = firebase.database().ref("games/"+ROOM+"/dungeon");
        pRef  = firebase.database().ref("games/"+ROOM+"/photos");

        /* Firebase tells us directly whether we're actually connected — far more honest
           than assuming we're live just because the scripts downloaded. This flips
           automatically on every drop and reconnect, so the status is always real. */
        firebase.database().ref(".info/connected").on("value", snap => {
          const wasOn = syncOn;
          syncOn = snap.val() === true;
          dSyncStage = syncOn ? "connected" : "offline — will reconnect automatically";
          if (syncOn && !wasOn) dSyncError = "";
          if (view==="gaunt" || view==="quest") render();
        });

        fbRef.on("value", snap => {
          const v = snap.val();
          if (v){ game = v; game.players = game.players || []; game.log = game.log || []; }
          else if (game && game.players && game.players.length) fbRef.set(fbSafe(game));
          gSeenServer = true;
          if (view==="quest") render();
        });
        dRef.on("value", snap => {
          const v = snap.val();
          if (v){
            v.players = v.players || [];
            const localMine = dungeon && dungeon.players && dungeon.players.find(p=>p.id===me.id);
            const serverHasMine = v.players.some(p=>p.id===me.id);
            if (localMine && !serverHasMine && v.phase==="lobby" && v.scenarioIndex===0) v.players.push(localMine);
            dungeon = v; dungeon.log = dungeon.log || [];
          } else {
            /* Server has nothing. Only seed it if WE actually have a game worth
               saving — otherwise a fresh page load (empty local state) would
               overwrite everyone else's real game with a blank one. */
            const localHasGame = dungeon && ((dungeon.players && dungeon.players.length) || dungeon.hostId);
            if (localHasGame) dRef.set(fbSafe(dungeon));
          }
          dSeenServer = true;
          dScheduleAutoResolve();
          if (view==="gaunt" && !dBusy) render();
        }, err => { dSyncError = "database read refused: "+(err && err.message ? err.message : "unknown"); render(); });
        pRef.on("value", snap => {
          const v = snap.val();
          if (v) photos = v; else if (photos.length) pRef.set(fbSafe(photos));
          renderPhotoStrip();
          if (view==="quest") render();
        });
      })
      .catch(err=>{
        dSyncStage = "failed";
        dSyncError = (err && err.message) ? err.message : "unknown error";
        if (!dSyncToastShown){ toast("Sync failed — see the status at the bottom"); dSyncToastShown = true; }
        render();
        setTimeout(initSync, 15000);
      });
  } catch(err){
    /* a crash in here used to leave the status frozen at "starting" with no clue why */
    dSyncStage = "crashed during setup";
    dSyncError = (err && err.message) ? err.message : String(err);
    render();
    setTimeout(initSync, 15000);
  }
}
const myPlayer = () => game.players.find(p=>p.id===me.id);
const activeP  = () => game.players[game.turn % Math.max(game.players.length,1)];
function canAct(){ const a=activeP(); if(!a) return false; return syncOn ? a.id===me.id : true; }
function logIt(s){ game.log.unshift({t:s, at:Date.now()}); game.log = game.log.slice(0,40); }
const stat = (p,s) => (CLASSES[p.cls]?CLASSES[p.cls][s]:0);

function joinGame(name, cls, av){
  if (game.players.some(p=>p.id===me.id)) return;
  me.name = name; saveMe();
  game.players.push({id:me.id,name,cls,av,pos:0,xp:0,gold:5,skip:false});
  logIt(`<b>${esc(name)}</b> the ${CLASSES[cls].n} joined the party`);
  saveGame(); render();
}
const allDone = () => game.players.length>0 && game.players.every(p=>p.fin);
function rollTurn(){
  const p = activeP(); if(!p || allDone()) return;
  if (p.fin){ endTurn(); saveGame(); render(); return; }
  if (p.skip){ p.skip=false; logIt(`<b>${esc(p.name)}</b> sat this one out`); endTurn(); saveGame(); render(); return; }
  const d20 = 1 + Math.floor(Math.random()*20);
  p.bestRoll = Math.max(p.bestRoll||0, d20);
  const move = Math.max(1, Math.ceil(d20/4));
  p.pos = Math.min(TRACK.length-1, p.pos + move);
  game.roll = d20;
  const tile = TRACK[p.pos];
  logIt(`<b>${esc(p.name)}</b> rolled ${d20} and moved to ${esc(tile.n)}`);

  if (tile.t==="quest" || tile.t==="boss"){
    const c = drawCard(tile.t);
    game.card = Object.assign({}, c, {kind:tile.t, by:p.id, tile:tile.n});
  } else if (tile.t==="tavern"){
    const c = drawCard("tavern");
    game.card = Object.assign({}, c, {kind:"tavern", by:p.id, tile:tile.n});
  } else if (tile.t==="trap"){
    const c = drawCard("trap");
    p.gold = Math.max(0, p.gold + (c.g||0));
    if (c.skip) p.skip = true;
    p.trapHits = (p.trapHits||0)+1;
    logIt(`${esc(c.t)}`);
    game.card = null; endTurn(); saveGame(); render(); return;
  } else if (tile.t==="finish"){
    p.xp += 10; p.fin = true; logIt(`<b>${esc(p.name)}</b> reached the Brunch Throne and took 10 XP`);
    game.card=null; endTurn(); saveGame(); render(); return;
  } else { game.card=null; endTurn(); }
  saveGame(); render();
}
function resolveCard(ok, photo){
  const c = game.card; if(!c) return;
  const p = game.players.find(x=>x.id===c.by); if(!p) return;
  if (c.kind==="tavern"){
    p.gold += c.g; p.xp += 2;
    if (ok) p.tavernRounds = (p.tavernRounds||0)+1;
    logIt(`<b>${esc(p.name)}</b> ${ok?"paid up":"skipped it"} at ${esc(c.tile)}`);
    if (!ok){ p.gold -= c.g; }
  } else {
    if (!ok) p.chickenOuts = (p.chickenOuts||0)+1;
    const d20 = 1+Math.floor(Math.random()*20);
    const total = d20 + stat(p, c.s||"luck");
    const win = ok && total >= (c.dc||12);
    if (win){ p.xp += 5; p.gold += 2; p.questWins = (p.questWins||0)+1; logIt(`<b>${esc(p.name)}</b> pulled it off — rolled ${total} vs ${c.dc}. +5 XP`); }
    else if (ok){ p.xp += 2; logIt(`<b>${esc(p.name)}</b> did it but rolled ${total} vs ${c.dc}. +2 XP for effort`); }
    else { p.gold = Math.max(0,p.gold-2); logIt(`<b>${esc(p.name)}</b> backed out. -2 gold`); }
    if (ok && photo){
      photos.unshift({id:uid(), name:p.name, av:p.av, text:c.t, dataUrl:photo, at:Date.now()});
      if (photos.length>150) photos = photos.slice(0,150);
      savePhotos();
      logIt(`<b>${esc(p.name)}</b> added a photo to the highlights`);
    }
  }
  game.card=null; endTurn(); saveGame(); render();
}
function endTurn(){ if (game.players.length) game.turn = (game.turn+1) % game.players.length; game.roll=null; }

/* ---- weekend awards — live standings, doubles as the end-of-weekend recap by Sunday ---- */
function computeAwards(){
  const ps = game.players; if (!ps.length) return [];
  const pick = (key,label,fmt) => {
    const withVal = ps.filter(p=>(p[key]||0)>0); if (!withVal.length) return null;
    const top = withVal.reduce((a,b)=>(b[key]||0)>(a[key]||0)?b:a);
    return {label, name:top.name, detail:fmt(top[key]||0)};
  };
  const awards = [];
  [ pick("trapHits","Most Cursed", v=>`${v} trap${v===1?"":"s"} hit`),
    pick("tavernRounds","Best Wingman", v=>`${v} round${v===1?"":"s"} bought`),
    pick("bestRoll","Luckiest Roll", v=>`rolled a ${v}`),
    pick("chickenOuts","Biggest Chicken", v=>`backed out ${v} time${v===1?"":"s"}`),
    pick("questWins","Quest Champion", v=>`${v} quest${v===1?"":"s"} pulled off`)
  ].forEach(a=>{ if(a) awards.push(a); });
  const richest = ps.slice().sort((a,b)=>(b.gold||0)-(a.gold||0))[0];
  if (richest && richest.gold>0) awards.push({label:"High Roller", name:richest.name, detail:`${richest.gold} gold`});
  return awards;
}
function renderAwards(){
  const awards = computeAwards(); if (!awards.length) return "";
  return `<div class="panel"><h3>🏆 Weekend Awards</h3>
    ${awards.map(a=>`<div class="lb"><span class="nm">${esc(a.label)}<small>${esc(a.detail)}</small></span><span class="sc">${esc(a.name)}</span></div>`).join("")}
    </div>`;
}

    ${photos.length>12?`<p class="note">+${photos.length-12} more from the weekend.</p>`:""}

   Original classes/monsters/cards (not reproducing anyone else's
   game text) built on the same idea: no dice for turn order, you
   play two cards a round (one for its top action, one for its
   bottom), and the numbers on those cards decide who goes first.
   ================================================================ */

const dLevel = p => 1 + Math.floor(p.xp/15);

/* ---- zone graph helpers (BFS over a small adjacency list) ---- */
function dScn(){ return DSCENARIOS[dungeon.scenarioIndex]; }
function dDist(scn,a,b){
  if(a===b) return 0;
  const seen=new Set([a]); let frontier=[a], d=0;
  while(frontier.length){ d++; const next=[];
    for(const z of frontier) for(const nb of scn.adj[z]) if(!seen.has(nb)){ if(nb===b) return d; seen.add(nb); next.push(nb); }
    frontier=next; }
  return Infinity;
}
function dReachable(scn,from,steps){
  const seen=new Set([from]); let frontier=[from];
  for(let s=0;s<steps;s++){ const next=[]; for(const z of frontier) for(const nb of scn.adj[z]) if(!seen.has(nb)){ seen.add(nb); next.push(nb); } frontier=next; }
  seen.delete(from); return [...seen];
}
function dNextHop(scn,from,to){
  if(from===to) return from;
  const prev={}; const seen=new Set([from]); let frontier=[from];
  while(frontier.length){ const next=[];
    for(const z of frontier) for(const nb of scn.adj[z]) if(!seen.has(nb)){
      seen.add(nb); prev[nb]=z;
      if(nb===to){ let cur=to; while(prev[cur]!==from && prev[cur]!==undefined) cur=prev[cur]; return cur; }
      next.push(nb);
    }
    frontier=next; }
  return from;
}
function dShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function dDrawMod(p){ if(!p.deck||!p.deck.length) p.deck = dShuffle(MODDECK.slice()); return p.deck.pop(); }

/* ---- turns a scenario's zone graph into an actual diagram instead of a name in a list.
   Zones are laid out left-to-right by how many steps they are from the start (BFS),
   and stacked vertically when a couple of zones sit at the same distance. ---- */
function dLayoutZones(scn){
  const depth={}, order=[], seen=new Set([scn.start]);
  depth[scn.start]=0; let frontier=[scn.start]; order.push(scn.start);
  while(frontier.length){
    const next=[];
    frontier.forEach(z=>scn.adj[z].forEach(nb=>{ if(!seen.has(nb)){ seen.add(nb); depth[nb]=depth[z]+1; order.push(nb); next.push(nb); } }));
    frontier=next;
  }
  const cols={};
  order.forEach(z=>{ const d=depth[z]; (cols[d]=cols[d]||[]).push(z); });
  const pos={};
  Object.keys(cols).forEach(d=>cols[d].forEach((z,i)=>{ pos[z]={col:+d, row:i, rowsInCol:cols[d].length}; }));
  return pos;
}
/* The map re-renders on every sync update, which used to snap it back to the far
   left mid-turn. We remember where it was scrolled and put it back, and only
   auto-centre when the player actually moves to a different room — or when they
   tap "Centre on me". Manual scrolling is never overridden. */
let dMapScroll = 0, dMapLastZone = null, dMapUserMoved = false;
function dRestoreMapScroll(){
  const el = $("dmapscroll");
  if (!el || !el.addEventListener) return;
  const zone = el.getAttribute("data-zone");
  const myx = parseFloat(el.getAttribute("data-myx"));
  const zoneChanged = zone !== "" && zone !== dMapLastZone;

  if (zoneChanged || !dMapUserMoved){
    if (!isNaN(myx)){
      const target = Math.max(0, myx - el.clientWidth/2);
      el.scrollLeft = target;
      dMapScroll = target;
    }
    if (zoneChanged){ dMapLastZone = zone; dMapUserMoved = false; }
  } else {
    el.scrollLeft = dMapScroll;   // leave it exactly where they put it
  }
  el.addEventListener("scroll", ()=>{
    dMapScroll = el.scrollLeft;
    dMapUserMoved = true;
  }, {passive:true});
}
function dCentreMapOnMe(){
  dMapUserMoved = false;
  const el = $("dmapscroll");
  if (el && el.getAttribute){
    const myx = parseFloat(el.getAttribute("data-myx"));
    if (!isNaN(myx)){ const t = Math.max(0, myx - el.clientWidth/2); el.scrollLeft = t; dMapScroll = t; }
  }
}
function hexPatternDef(){
  const r=11, w=r*3, h=r*Math.sqrt(3);
  const hex = (cx,cy)=>{
    let p=[]; for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i); p.push((cx+r*Math.cos(a)).toFixed(2)+","+(cy+r*Math.sin(a)).toFixed(2)); }
    return `<polygon points="${p.join(" ")}" style="fill:none;stroke:#33546B;stroke-width:.7;opacity:.5"/>`;
  };
  return `<pattern id="hexfloor" width="${w.toFixed(2)}" height="${h.toFixed(2)}" patternUnits="userSpaceOnUse">
    ${hex(0,0)}${hex(0,h)}${hex(r*1.5,h/2)}${hex(w,0)}${hex(w,h)}
  </pattern>`;
}

function dRenderMap(scn, highlight){
  highlight = highlight || {};
  const pos = dLayoutZones(scn);
  const colW=168, rowH=138, pad=24, topPad=10;
  const maxCol = Math.max(...Object.values(pos).map(p=>p.col));
  const maxRows = Math.max(...Object.values(pos).map(p=>p.rowsInCol));
  const w = pad*2 + (maxCol+1)*colW, h = pad*2 + topPad + maxRows*rowH;
  const center = z => { const p=pos[z]; const x=pad+p.col*colW+colW/2;
    const totalH=p.rowsInCol*rowH; const y=topPad+(h-topPad-totalH)/2+rowH/2+p.row*rowH; return {x,y}; };
  const rw=142, rh=116;

  /* corridors — stone passage with a door plate at the midpoint */
  const seenEdge=new Set(); let edges="";
  scn.zones.forEach((_,z)=>scn.adj[z].forEach(nb=>{
    const key=[z,nb].sort((a,b)=>a-b).join("-"); if(seenEdge.has(key)) return; seenEdge.add(key);
    const a=center(z), b=center(nb);
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const ang = Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI;
    edges += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" style="stroke:#243B4A;stroke-width:15;stroke-linecap:butt"/>
      <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" style="stroke:#16293544;stroke-width:11;stroke-linecap:butt"/>
      <g transform="translate(${mx},${my}) rotate(${ang})">
        <rect x="-4.5" y="-9" width="9" height="18" rx="1.5" style="fill:#7A5B33;stroke:var(--syrup);stroke-width:1.4"/>
        <circle cx="0" cy="0" r="1.5" style="fill:var(--syrup)"/>
      </g>`;
  }));

  /* a small health bar floating just above a token — the one piece of UI that used
     to live in a separate bulky list is now read straight off the board instead */
  const hpBar = (cx, topY, wpx, pct) => {
    const color = pct<=0 ? "#555" : pct<30 ? "var(--sunset)" : pct<65 ? "var(--syrup)" : "var(--go)";
    return `<rect x="${cx-wpx/2}" y="${topY}" width="${wpx}" height="3.5" rx="1.75" style="fill:#00000070"/>
      <rect x="${cx-wpx/2}" y="${topY}" width="${wpx*Math.max(0,Math.min(100,pct))/100}" height="3.5" rx="1.75" style="fill:${color}"/>`;
  };

  const mine = myDP();
  let nodes="";
  scn.zones.forEach((name,z)=>{
    const c=center(z);
    const shown = dIsRevealed(z);
    const hereM = shown ? dungeon.monsters.filter(m=>m.alive && m.zone===z) : [];
    const hereP = dungeon.players.filter(p=>p.zone===z); // includes KO'd — the map is now the single source of truth
    const isMine = mine && mine.zone===z;
    const hl = highlight[z];
    const stroke = hl==="go" ? "var(--go)" : hl==="atk" ? "var(--sunset)" : isMine ? "var(--syrup)" : (shown ? "#3A5468" : "#2C3E4C");
    const sw = (hl || isMine) ? 3.5 : 2;
    const clipId = "clip"+scn.id+"_"+z;
    const glow = (hl || isMine) ? `<rect x="${c.x-rw/2-5}" y="${c.y-rh/2-5}" width="${rw+10}" height="${rh+10}" rx="7" style="fill:none;stroke:${stroke};stroke-width:1.5;opacity:.35"/>` : "";

    /* an unopened room shows nothing but a sealed door — you find out what's inside
       only when someone walks in, same as opening a door in Gloomhaven */
    if (!shown){
      nodes += `<g>${glow}
        <rect x="${c.x-rw/2}" y="${c.y-rh/2}" width="${rw}" height="${rh}" rx="5" style="fill:#101E28;stroke:${stroke};stroke-width:${sw};stroke-dasharray:6 4"/>
        <text x="${c.x}" y="${c.y-2}" text-anchor="middle" style="font-size:26px;opacity:.8">🚪</text>
        <text x="${c.x}" y="${c.y+24}" text-anchor="middle" style="font:700 10.5px Inter,sans-serif;fill:#6E8695">Unopened</text>
      </g>`;
      return;
    }
    const treasOpen = dTreasureAt(z) && !dTreasureTaken(z);

    /* monsters as standees, each with its own HP bar overhead — bosses get a bigger gold-ringed base */
    let monRow = "";
    if (hereM.length){
      const shown = hereM.slice(0,4);
      shown.forEach((m,i)=>{
        const mx = c.x - ((shown.length-1)*24)/2 + i*24;
        const my = c.y-14;
        const r = m.boss ? 14 : 11.5;
        const ring = m.boss ? "var(--syrup)" : "var(--sunset)";
        const rw2 = m.boss ? 2.4 : 1.6;
        const pct = Math.round(100*m.hp/m.maxHp);
        monRow += hpBar(mx, my-r-7, r*1.7, pct);
        monRow += `<ellipse cx="${mx}" cy="${my+r}" rx="${r-1}" ry="3.5" style="fill:#00000055"/>
          <circle cx="${mx}" cy="${my}" r="${r}" style="fill:#4A2019;stroke:${ring};stroke-width:${rw2}"/>
          <text x="${mx}" y="${my+5}" text-anchor="middle" style="font-size:${m.boss?16:13}px">${monIconOf(m.name)}</text>`;
      });
      if (hereM.length>4) monRow += `<text x="${c.x+56}" y="${c.y-9}" text-anchor="middle" style="font:700 10px Inter,sans-serif;fill:var(--sunset)">+${hereM.length-4}</text>`;
    }
    /* players as class-colored standees with their own HP bar — KO'd ones stay visible, just grayed out */
    let playRow = "", nameLine = "";
    if (hereP.length){
      const shown = hereP.slice(0,4);
      shown.forEach((p,i)=>{
        const st = DCLASS_STYLE[p.cls];
        const px = c.x - ((shown.length-1)*24)/2 + i*24;
        const py = c.y+26;
        const r = 11;
        if (p.ko){
          playRow += `<ellipse cx="${px}" cy="${py+r-1}" rx="${r-1}" ry="3.5" style="fill:#00000055"/>
            <circle cx="${px}" cy="${py}" r="${r}" style="fill:#2A2E33;stroke:#5A6470;stroke-width:1.6;opacity:.75"/>
            <text x="${px}" y="${py+4}" text-anchor="middle" style="font-size:11px;opacity:.6">💀</text>`;
        } else {
          const pct = Math.round(100*p.hp/dMaxHp(p));
          playRow += hpBar(px, py-r-7, r*1.7, pct);
          playRow += `<ellipse cx="${px}" cy="${py+r-1}" rx="${r-1}" ry="3.5" style="fill:#00000055"/>
            <circle cx="${px}" cy="${py}" r="${r}" style="fill:${st.color};stroke:#0A161E;stroke-width:1.6"/>
            <text x="${px}" y="${py+4}" text-anchor="middle" style="font-size:11px">${st.icon}</text>`;
        }
      });
      nameLine = hereP.map(p=>p.name.slice(0,4)+(p.ko?"✝":"")).join(" · ");
      if (nameLine.length>24) nameLine = nameLine.slice(0,22)+"…";
    }

    nodes += `<g>${glow}
      <defs><clipPath id="${clipId}"><rect x="${c.x-rw/2}" y="${c.y-rh/2}" width="${rw}" height="${rh}" rx="5"/></clipPath></defs>
      <rect x="${c.x-rw/2}" y="${c.y-rh/2}" width="${rw}" height="${rh}" rx="5" style="fill:#1B3140;stroke:${stroke};stroke-width:${sw}"/>
      <rect x="${c.x-rw/2}" y="${c.y-rh/2}" width="${rw}" height="${rh}" rx="5" style="fill:url(#hexfloor)"/>
      <rect x="${c.x-rw/2}" y="${c.y-rh/2}" width="${rw}" height="18" style="fill:#0F2431;opacity:.92" clip-path="url(#${clipId})"/>
      <text x="${c.x-rw/2+9}" y="${c.y-rh/2+13.5}" style="font-size:11px">${ZONEICON[name]||"◆"}</text>
      <text x="${c.x-rw/2+25}" y="${c.y-rh/2+13.5}" style="font:700 11px Inter,sans-serif;fill:var(--sand)">${esc(name)}</text>
      ${treasOpen?`<text x="${c.x+rw/2-14}" y="${c.y-rh/2+14}" text-anchor="middle" style="font-size:13px">💎</text>`:""}
      ${monRow}${playRow}
      ${nameLine?`<rect x="${c.x-rw/2}" y="${c.y+rh/2-15}" width="${rw}" height="15" style="fill:#0F2431;opacity:.92" clip-path="url(#${clipId})"/>
        <text x="${c.x}" y="${c.y+rh/2-4.5}" text-anchor="middle" style="font:700 9.5px Inter,sans-serif;fill:var(--go)">${esc(nameLine)}</text>`:""}
    </g>`;
  });

  const myZoneX = (mine && pos[mine.zone]) ? center(mine.zone).x : null;
  return `<div class="panel"><h3>🗺 Map</h3>
    <div id="dmapscroll" data-myx="${myZoneX===null?"":Math.round(myZoneX)}" data-zone="${mine?mine.zone:""}" style="overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px">
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block" xmlns="http://www.w3.org/2000/svg">
      <defs><radialGradient id="dgmap" cx="50%" cy="35%" r="82%">
        <stop offset="0%" stop-color="#142936"/><stop offset="100%" stop-color="#080F15"/>
      </radialGradient>${hexPatternDef()}</defs>
      <rect x="0" y="0" width="${w}" height="${h}" rx="10" style="fill:url(#dgmap)"/>
      ${edges}${nodes}
    </svg></div>
    <p class="note">Your room glows amber${Object.keys(highlight).length?" — lit-up rooms are your options right now.":"."}${maxCol>2?" Swipe to look around.":""}</p>
    ${maxCol>2?`<div class="acts"><button class="btn ghost" id="d_centremap">🎯 Centre on me</button></div>`:""}</div>`;
}
function monIconOf(name){ return MONICON[name] || "👹"; }

/* ---- monster spawning. Scaling on player count was tested and found brutally
   unwinnable for a party of 7-8 — trash mob counts now stay fixed, and only the
   boss gets a small HP bump so bigger groups still get a real fight at the end. ---- */
function dSpawn(scn, playerCount){
  const bossBonus = playerCount; // modest — bosses alone scale with the party
  const list=[];
  scn.spawns.forEach(s=>{
    const hp = s.hp + (s.boss ? bossBonus : 0);
    for(let i=0;i<s.count;i++) list.push({id:uid(),name:s.name,hp,maxHp:hp,dmg:s.dmg,rng:s.rng,init:s.init,
                                     behavior:s.behavior,boss:!!s.boss,zone:s.zone,alive:true});
  });
  return list;
}

/* ---- resolving one action (attack/move/heal/shield/taunt) for a player ---- */
function dDoAction(scn, p, action, target){
  if (action.a==="move"){
    p.zone=target;
    logD(`<b>${esc(p.name)}</b> moved to ${esc(scn.zones[target])}`);
    dRevealZone(target);
    dTryTakeTreasure(p, target);
  }
  else if (action.a==="attack"){
    const val = action.val + (dLevel(p)-1) + (p.gearAtk||0);
    const m = dungeon.monsters.find(x=>x.id===target);
    if(!m||!m.alive){ logD(`${esc(p.name)}'s attack finds nothing there`); return; }
    const mod = dDrawMod(p);
    const dmg = mod==="miss" ? 0 : mod==="x2" ? val*2 : Math.max(0,val+mod);
    m.hp = Math.max(0, m.hp-dmg); if (m.hp<=0) m.alive=false;
    logD(`<b>${esc(p.name)}</b> hit ${esc(m.name)} for ${dmg}${mod==="miss"?" (miss)":mod==="x2"?" — crit!":""}`);
    if(!m.alive) logD(`${esc(m.name)} is down`);
  } else if (action.a==="heal"){
    const val = action.val + Math.floor((dLevel(p)-1)/2);
    const ally = target==="self" ? p : dungeon.players.find(x=>x.id===target);
    if(!ally) return;
    ally.hp = Math.min(dMaxHp(ally), ally.hp+val); if (ally.hp>0) ally.ko=false;
    logD(`<b>${esc(p.name)}</b> healed ${esc(ally.name)} for ${val}`);
  } else if (action.a==="shield"){ p.shield=(p.shield||0)+action.val; logD(`<b>${esc(p.name)}</b> braces (+${action.val} shield)`); }
  else if (action.a==="taunt"){ p.taunt=true; logD(`<b>${esc(p.name)}</b> draws their attention`); }
}
function dMonsterHit(m,p){
  let dmg = Math.max(0, m.dmg - (p.shield||0));
  p.hp = Math.max(0, p.hp-dmg);
  logD(`${esc(m.name)} hits <b>${esc(p.name)}</b> for ${dmg}`);
  if (p.hp<=0){ p.ko=true; logD(`<b>${esc(p.name)}</b> is knocked out`); }
}
function dMonsterTurn(scn, m){
  const alive = dungeon.players.filter(p=>!p.ko); if(!alive.length) return;
  if (m.behavior==="melee" || m.behavior==="boss1"){
    let targets = alive.filter(p=>p.taunt); if(!targets.length) targets=alive;
    let best=null,bestD=Infinity;
    targets.forEach(p=>{ const d=dDist(scn,m.zone,p.zone); if(d<bestD){bestD=d;best=p;} });
    if (bestD>0) m.zone = dNextHop(scn, m.zone, best.zone);
    const here = alive.filter(p=>p.zone===m.zone);
    if (here.length) dMonsterHit(m, m.behavior==="boss1" ? here.reduce((a,b)=>a.hp>b.hp?a:b) : here[Math.floor(Math.random()*here.length)]);
    else logD(`${esc(m.name)} closes in`);
  } else if (m.behavior==="ranged"){
    const inRange = alive.filter(p=>dDist(scn,m.zone,p.zone)<=m.rng);
    if (inRange.length) dMonsterHit(m, inRange.reduce((a,b)=>a.hp<b.hp?a:b));
    else logD(`${esc(m.name)} holds position`);
  } else if (m.behavior==="boss2"){
    m._t=(m._t||0)+1;
    if (m._t%2===0){ m.hp=Math.min(m.maxHp,m.hp+3); logD(`${esc(m.name)} mends its wounds (+3 HP)`); }
    else { const inRange=alive.filter(p=>dDist(scn,m.zone,p.zone)<=m.rng); if(inRange.length) dMonsterHit(m, inRange[Math.floor(Math.random()*inRange.length)]); else logD(`${esc(m.name)} waits`); }
  } else if (m.behavior==="boss3"){
    m._t=(m._t||0)+1;
    const inRange=alive.filter(p=>dDist(scn,m.zone,p.zone)<=m.rng);
    if(!inRange.length){ logD(`${esc(m.name)} waits`); return; }
    if (m._t%3===0){ dShuffle(inRange.slice()).slice(0,2).forEach(v=>dMonsterHit(m,v)); logD(`${esc(m.name)} unleashes a sweeping strike`); }
    else dMonsterHit(m, inRange[Math.floor(Math.random()*inRange.length)]);
  } else if (m.behavior==="boss4"){
    const enraged = m.hp <= m.maxHp*0.4;
    const inRange = alive.filter(p=>dDist(scn,m.zone,p.zone)<=m.rng);
    if (!inRange.length){
      let best=null,bestD=Infinity;
      alive.forEach(p=>{ const d=dDist(scn,m.zone,p.zone); if(d<bestD){bestD=d;best=p;} });
      if (best && bestD>0) m.zone = dNextHop(scn, m.zone, best.zone);
      logD(`${esc(m.name)} closes in`);
      return;
    }
    if (enraged) logD(`${esc(m.name)} is enraged!`);
    const hits = enraged ? 2 : 1;
    for (let i=0;i<hits;i++){
      const stillInRange = dungeon.players.filter(p=>!p.ko && dDist(scn,m.zone,p.zone)<=m.rng);
      if (!stillInRange.length) break;
      dMonsterHit(m, stillInRange.reduce((a,b)=>a.hp<b.hp?a:b));
    }
  }
}

/* ---- round flow ---- */
function dAllReady(){ return dungeon.players.filter(p=>!p.ko).every(p=>p.selected && p.selected.ready); }
/* ---- room reveal: monsters stay dormant until someone opens their room, the way
   Gloomhaven doors work. A dormant monster doesn't move, doesn't attack, and isn't
   in the turn order — it only wakes when a player steps into its room. ---- */
function dIsRevealed(z){ return (dungeon.revealed||[]).indexOf(z) !== -1; }
function dMonsterActive(m){ return m.alive && dIsRevealed(m.zone); }
function dRevealZone(z){
  dungeon.revealed = dungeon.revealed || [];
  if (dungeon.revealed.indexOf(z) !== -1) return;
  dungeon.revealed.push(z);
  const scn = dScn();
  const woke = dungeon.monsters.filter(m=>m.alive && m.zone===z);
  if (woke.length){
    const counts = {};
    woke.forEach(m=>{ counts[m.name] = (counts[m.name]||0)+1; });
    const list = Object.entries(counts).map(([n,c])=>c>1?`${c} ${n}s`:n).join(", ");
    logD(`🚪 <b>${esc(scn.zones[z])}</b> opens — ${esc(list)} inside!`);
  } else {
    logD(`🚪 <b>${esc(scn.zones[z])}</b> opens — empty.`);
  }
  const treas = dTreasureAt(z);
  if (treas && !dTreasureTaken(z)) logD(`💎 There's treasure in ${esc(scn.zones[z])}`);
}
/* ---- treasure: always optional. It sits off the critical path, so grabbing it
   costs you movement, but the whole party shares the reward at scenario end. ---- */
function dTreasureAt(z){
  const scn = dScn();
  return (scn.treasure||[]).find(t=>t.zone===z) || null;
}
function dTreasureTaken(z){ return (dungeon.treasureTaken||[]).indexOf(z) !== -1; }
function dTryTakeTreasure(p, z){
  const t = dTreasureAt(z);
  if (!t || dTreasureTaken(z)) return;
  dungeon.treasureTaken = dungeon.treasureTaken || [];
  dungeon.treasureTaken.push(z);
  logD(`💎 <b>${esc(p.name)}</b> grabbed the treasure — +${t.gold} gold and +${t.xp} XP for everyone`);
}

function dBuildOrder(){
  const order=[];
  dungeon.players.forEach(p=>{ if(!p.ko && p.selected && p.selected.ready && !p.selected.rest) order.push({kind:"player",id:p.id,init:p.selected.initVal}); });
  dungeon.monsters.forEach(m=>{ if(dMonsterActive(m)) order.push({kind:"monster",id:m.id,init:m.init}); });
  order.sort((a,b)=>a.init-b.init);
  return order;
}
function dStartScenario(){
  const scn = DSCENARIOS[dungeon.scenarioIndex], n = dungeon.players.length;
  dungeon.monsters = dSpawn(scn, n);
  dungeon.players.forEach(p=>{
    p.hand = DCARDS[p.cls].map(c=>c.id); p.discard=[]; p.lost=[];
    p.maxHp = dMaxHp(p); p.hp = p.maxHp; p.zone = scn.start; p.shield=0; p.taunt=false; p.ko=false; p.selected=null; p.deck=[];
  });
  dungeon.phase="battle"; dungeon.sub="selecting"; dungeon.round=1; dungeon.order=[]; dungeon.turnPtr=0;
  dungeon.revealed = []; dungeon.treasureTaken = [];
  logD(`<b>${esc(scn.name)}</b> begins`);
  dRevealZone(scn.start);
}
function dEndScenario(won){
  const scn = DSCENARIOS[dungeon.scenarioIndex];
  if (won){
    let tGold=0, tXp=0;
    (dungeon.treasureTaken||[]).forEach(z=>{
      const t = (scn.treasure||[]).find(x=>x.zone===z);
      if (t){ tGold += t.gold; tXp += t.xp; }
    });
    dungeon.players.forEach(p=>{ p.gold=(p.gold||0)+scn.reward.gold+tGold; p.xp=(p.xp||0)+scn.reward.xp+tXp; });
    logD(`Scenario complete — everyone earns ${scn.reward.gold} gold and ${scn.reward.xp} XP`);
    if (tGold||tXp) logD(`💎 Treasure bonus — +${tGold} gold and +${tXp} XP each`);
    else if ((scn.treasure||[]).length) logD(`💎 You left the treasure behind`);
    dungeon.scenarioIndex++;
    dungeon.phase = dungeon.scenarioIndex>=DSCENARIOS.length ? "victory" : "lobby";
  } else {
    logD(`The party has fallen in ${esc(scn.name)}`);
    dungeon.phase = "defeat";
  }
}
function dCheckRoundEnd(){
  if (dungeon.monsters.length && dungeon.monsters.every(m=>!m.alive)){ dEndScenario(true); return true; }
  if (dungeon.players.every(p=>p.ko)){ dEndScenario(false); return true; }
  return false;
}

/* ---- render: campaign lobby / character creation ---- */
function renderGaunt(){
  const mine = myDP();
  let h = "";
  if (!mine) h = dRenderJoin();
  else if (dungeon.phase==="lobby") h = dRenderLobby(mine);
  else if (dungeon.phase==="battle") h = dRenderBattle(mine);
  else if (dungeon.phase==="victory") h = dRenderVictory();
  else if (dungeon.phase==="defeat") h = dRenderDefeat();
  return h + dResetPanel() + dSyncStatus();
}
function dSyncStatus(){
  const errBox = dSyncError ? `<div class="panel" style="border-color:var(--sunset)">
    <h3 style="color:var(--sunset)">⚠️ Something went wrong</h3>
    <p style="margin-top:4px"><b style="color:var(--sand)">Error:</b> ${esc(dSyncError)}</p>
    <div class="acts"><button class="btn ghost" id="d_clearerr">Dismiss</button></div>
    <p class="note" style="margin-top:8px">Screenshot this — the error text says exactly what failed.</p></div>` : "";
  if (syncOn) return errBox + `<p class="mode">🟢 Live — synced, everyone sees the same game</p>`;
  return errBox + `<div class="panel" style="border-color:var(--sunset)">
    <h3 style="color:var(--sunset)">🔴 Not synced</h3>
    <p>Progress is only on this phone right now. Others won't see it and it isn't backed up.</p>
    <p style="margin-top:8px"><b style="color:var(--sand)">Status:</b> ${esc(dSyncStage)}</p>
    <div class="acts"><button class="btn go" id="d_retrysync">Try connecting again</button></div>
    <p class="note" style="margin-top:8px">If this keeps failing, screenshot this box — the status and error tell us exactly what's wrong.</p></div>`;
}
function dResetPanel(){
  const canReset = dIAmHost();
  if (!canReset) return "";
  return `<div class="panel"><h3>Reset</h3><p>Wipes every character, the host claim, and progress — good for testing today before the trip.</p>
    <div class="acts"><button class="btn warn" id="d_resetall">Reset the Gauntlet</button></div></div>`;
}
/* Host is exclusive at the SERVER level, not just hidden in the UI. We read the
   live value and only write if it's genuinely free. There is deliberately no
   takeover path — the current host must release it first. A device that can't
   reach the server refuses rather than pretending it succeeded. */
function dClaimHostSafely(nm){
  if (!myDP()){
    toast("Create your character first — host is tied to it");
    return;
  }
  if (!syncOn || !dRef){
    toast("Can't claim host while offline — connect first");
    render(); return;
  }
  toast("Checking…");
  dRef.child("hostId").once("value")
    .then(snap=>{
      const serverHost = snap.val();
      const serverHostIsReal = serverHost && dungeon.players.some(p=>p.id===serverHost);
      if (serverHost && serverHost!==me.id && serverHostIsReal){
        toast((dungeon.hostName||"Someone")+" is already host");
        render(); return;
      }
      try {
        dungeon.hostId=me.id; dungeon.hostName=nm; me.name=nm; saveMe();
        saveDungeon(); render(); toast("You're the host");
      } catch(inner){
        dungeon.hostId=null; dungeon.hostName=null;
        dSyncError = "claiming host failed while saving: "+(inner && inner.message ? inner.message : String(inner));
        render();
      }
    })
    .catch(e=>{
      dSyncError = "host check failed: "+(e && e.message ? e.message : "unknown");
      toast("Couldn't confirm host — see the error above");
      render();
    });
}
/* A host claim is only meaningful once you have a character, because your identity
   comes from your recovery code — claiming first would tie host to a temporary ID
   that stops existing the moment you create your character. If that ever happens
   anyway (or a host's character is wiped), the claim is orphaned and we free it. */
function dHostIsOrphaned(){
  return !!dungeon.hostId && !dungeon.players.some(p=>p.id===dungeon.hostId);
}
/* one source of truth for host permissions — an orphaned claim counts as no host,
   so a stale ID can never lock the whole party out of starting or resetting */
function dRealHostId(){ return dHostIsOrphaned() ? null : (dungeon.hostId || null); }
function dIAmHost(){ const h = dRealHostId(); return !h || h === me.id; }
function dHostPanel(){
  const host = dungeon.hostId;
  const iHaveCharacter = !!myDP();

  /* nothing to say about hosting until you actually have a character —
     showing "who's running this" before character creation felt premature */
  if (!iHaveCharacter && !host) return "";

  if (host && dHostIsOrphaned()){
    return `<div class="panel"><h3>Host slot is open</h3>
      <p>The previous host claim wasn't tied to a character, so it's been released.
      ${iHaveCharacter?"You can claim it now.":"Create your character below, then claim it."}</p>
      ${iHaveCharacter?`<div class="acts"><button class="btn go" id="d_claimhost">I'm running this</button></div>`:""}</div>`;
  }
  if (!host){
    return `<div class="panel"><h3>Who's running this?</h3>
      <p>Whoever's hosting the trip should claim this — you'll control the headcount and when each scenario starts. Everyone else just plays.</p>
      <div class="acts"><button class="btn go" id="d_claimhost">I'm running this</button></div></div>`;
  }
  if (host===me.id) return `<div class="panel"><h3>You're the host</h3>
    <p>You control the headcount and when each scenario starts. Everything else — cards, moves, turns — anyone can drive. Nobody else can take host from you.</p>
    <div class="acts"><button class="btn ghost" id="d_releasehost">Release host</button></div>
    <p class="note" style="margin-top:8px">Only release it if you're handing off or switching phones — it frees the role for someone else to claim.</p></div>`;
  return `<div class="panel"><p class="note">🔒 Hosted by ${esc(dungeon.hostName||"someone")} — only they can start scenarios.</p></div>`;
}
/* Identity is derived from a code the player picks, not a random per-device value.
   Same code entered on any phone or tablet = the same character, so switching
   devices mid-trip keeps your progress, your gear, and host if you had it. */
function dCodeToId(code){
  const clean = String(code||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  return clean ? "pc_"+clean : "";
}
function dRenderJoin(){
  const counts = dClassCounts(), entries = Object.entries(DCLASSES);
  const firstOpen = entries.findIndex(([k])=>counts[k]<CLASS_CAP);
  return dHostPanel() + `<div class="panel"><h3>Build your character</h3>
    <p>This carries across all three days — same character, same gold and XP, from Friday's cellar to Sunday's vault.</p>
    <label for="d_name">Your name</label><input id="d_name" value="${esc(me.name||"")}" placeholder="Captain">
    <label for="d_code">Pick a recovery code <small style="color:var(--kelp);font-weight:400">— write it down. Enter it on any other phone or iPad to pick up this exact character.</small></label>
    <input id="d_code" placeholder="e.g. captain-cellar-99" autocapitalize="off" autocorrect="off">
    <label>Class <small style="color:var(--kelp);font-weight:400">(2 max per class, so the party stays spread out)</small></label>
    <div class="classpick" id="d_class">${entries.map(([k,c],idx)=>{
      const full = counts[k]>=CLASS_CAP;
      return `<button data-dcls="${k}" class="${idx===firstOpen?"on":""} ${full?"full":""}" ${full?"disabled":""}>${c.n}<small>${full?`Full — ${CLASS_CAP}/${CLASS_CAP} taken`:c.d}</small></button>`;
    }).join("")}</div>
    <div class="acts" style="margin-top:16px"><button class="btn go" id="d_go">Enter the Gauntlet</button></div></div>
  <div class="panel"><h3>Switching devices?</h3>
    <p>If you already made a character on another phone, enter its recovery code here to pick it right back up.</p>
    <label for="d_restore">Recovery code</label><input id="d_restore" placeholder="your code" autocapitalize="off" autocorrect="off">
    <div class="acts"><button class="btn solid" id="d_dorestore">Restore my character</button></div></div>
  <div class="panel"><h3>How it plays</h3>
    <p>Every round you play two cards from your hand — one for its top action, one for its bottom. The number on the card
    you use for your top action sets your turn order that round, same as the monsters. No dice for that part.
    Attacks draw from a small deck of modifiers instead of rolling. Run low on cards and you'll need to rest.
    Beat all three scenarios as a party to finish the campaign.</p>
    <div class="acts"><button class="btn ghost" id="d_tutorial">Show the quick tutorial</button></div></div>`;
}
function dRenderLobby(mine){
  const scn = DSCENARIOS[dungeon.scenarioIndex];
  if (dungeon.scenarioIndex===0) return dRenderWaitingRoom(scn, mine);
  const isHost = dRealHostId() === me.id;
  let h = `<div class="panel"><h3>${esc(scn.name)}</h3><p>${esc(scn.day)} · ${esc(scn.blurb)}</p>
    ${isHost ? `<div class="acts"><button class="btn go" id="d_begin">Begin scenario</button></div>`
             : `<p class="note">Waiting for ${esc(dungeon.hostName||"the host")} to start ${esc(scn.name)}.</p>`}</div>`;
  h += `<div class="panel"><h3>Your character</h3>
    <p>${DCLASSES[mine.cls].n} · Level ${dLevel(mine)} · ${mine.gold||0} gold</p>
    ${me.code?`<p class="note" style="margin-top:6px">🔑 Recovery code: <b style="color:var(--syrup)">${esc(me.code)}</b> — enter this on another device to continue as this character.</p>`:""}
    <label>Whetstone — permanent +1 to attacks (10 gold)</label>
    <div class="acts"><button class="btn ${((mine.gold||0)<10)?"ghost":"solid"}" data-buy="atk" ${((mine.gold||0)<10)?"disabled":""}>Buy</button></div>
    <label>Vitality Charm — permanent +2 max HP (10 gold)</label>
    <div class="acts"><button class="btn ${((mine.gold||0)<10)?"ghost":"solid"}" data-buy="hp" ${((mine.gold||0)<10)?"disabled":""}>Buy</button></div>
    <p class="note">Gear bought: ${mine.gearAtk?`+${mine.gearAtk} attack `:""}${mine.gearHp?`+${mine.gearHp} HP`:""}${(!mine.gearAtk&&!mine.gearHp)?"none yet":""}</p></div>`;
  h += `<div class="panel"><h3>The party</h3>` + dungeon.players.map(p=>
    `<div class="lb"><span class="nm">${esc(p.name)}<small>${DCLASSES[p.cls].n} · Level ${dLevel(p)}</small></span><span class="sc">${p.gold||0}g</span></div>`).join("") + `</div>`;
  return h;
}
function dRenderWaitingRoom(scn, mine){
  const need = dungeon.expectedCount, have = dungeon.players.length;
  const ready = need ? have>=need : true;
  const isHost = dRealHostId() === me.id;
  let h = dHostPanel();
  h += `<div class="panel"><h3>${esc(scn.name)}</h3><p>${esc(scn.day)} · ${esc(scn.blurb)}</p></div>`;
  h += `<div class="panel"><h3>Waiting for the party</h3>
    <p>${have} of ${need||"?"} have joined.</p>
    ${dungeon.players.map(p=>`<div class="lb"><span class="nm">${esc(p.name)}<small>${DCLASSES[p.cls].n}</small></span></div>`).join("")}
    ${isHost ? `
      <div class="acts"><button class="btn go" id="d_begin" ${ready?"":"disabled"}>${ready?"Begin scenario":"Waiting for everyone…"}</button></div>
      ${!ready?`<div class="acts"><button class="btn ghost" id="d_beginanyway">Start now with ${have}</button></div>`:""}
      <p class="note">${need?`Waiting for ${need} total.`:"Set a headcount below so the game knows when to unlock."} You're the host — you decide when to start.</p>
      ${need==null?`<label for="d_count">How many people total?</label><input id="d_count" type="number" min="1" max="20" placeholder="7">
        <div class="acts"><button class="btn ghost" id="d_setcount">Set headcount</button></div>`:""}
    ` : `<p class="note">Waiting for ${esc(dungeon.hostName||"the host")} to start things off.</p>`}
    </div>`;
  h += `<div class="panel"><h3>How to play</h3><div class="acts"><button class="btn ghost" id="d_tutorial">Show the quick tutorial</button></div></div>`;
  return h;
}
function dRenderVictory(){
  const win = dungeon.players.slice().sort((a,b)=>b.xp-a.xp)[0];
  return `<div class="hero-q"><p class="who">Campaign complete</p><h2>${esc(win.name)} led the party</h2>
    <p class="who">Level ${dLevel(win)} ${DCLASSES[win.cls].n}</p></div>
    <div class="panel"><h3>Final standings</h3>${dungeon.players.slice().sort((a,b)=>b.xp-a.xp).map(p=>
      `<div class="lb"><span class="nm">${esc(p.name)}<small>${DCLASSES[p.cls].n}</small></span><span class="sc">${p.xp} XP</span></div>`).join("")}</div>`;
}
function dRenderDefeat(){
  return `<div class="panel"><h3>The party has fallen</h3><p>${esc(DSCENARIOS[dungeon.scenarioIndex].name)} gets the better of you this time.</p>
    <div class="acts"><button class="btn go" id="d_retry">Retry this scenario</button></div></div>`;
}

/* ---- always-visible "where are we" status — round, phase, and who's up ---- */
function dPhaseBanner(){
  if (dungeon.sub==="selecting"){
    const ready = dungeon.players.filter(p=>!p.ko && p.selected && p.selected.ready).length;
    const total = dungeon.players.filter(p=>!p.ko).length;
    return `<div class="phasebar"><span class="dot2"></span>Round ${dungeon.round} — choosing cards (${ready}/${total} ready)</div>`;
  }
  const entry = (dungeon.order||[])[dungeon.turnPtr];
  if (!entry) return `<div class="phasebar"><span class="dot2"></span>Round ${dungeon.round} — wrapping up…</div>`;
  if (entry.kind==="monster"){
    const m = dungeon.monsters.find(x=>x.id===entry.id);
    return `<div class="phasebar"><span class="dot2"></span>Round ${dungeon.round} — ${esc(m?m.name:"a monster")} is acting…</div>`;
  }
  const p = dungeon.players.find(x=>x.id===entry.id);
  return `<div class="phasebar"><span class="dot2"></span>Round ${dungeon.round} — ${esc(p?p.name:"someone")}'s turn</div>`;
}
function dOrderList(){
  if (dungeon.sub!=="resolving" || !dungeon.order || !dungeon.order.length) return "";
  return `<div class="panel"><h3>Turn order</h3>
    <div class="orderrow">${dungeon.order.map((e,i)=>{
      const isNow=i===dungeon.turnPtr, isDone=i<dungeon.turnPtr;
      let label, icon;
      if (e.kind==="monster"){ const m=dungeon.monsters.find(x=>x.id===e.id); label=m?m.name:"?"; icon="👹"; }
      else { const p=dungeon.players.find(x=>x.id===e.id); label=p?p.name:"?"; icon=p?DCLASS_STYLE[p.cls].icon:"?"; }
      const short = label.length>9 ? label.slice(0,8)+"…" : label;
      return `<div class="ochip ${isNow?"now":""} ${isDone?"done":""}">${icon} ${esc(short)}</div>`;
    }).join("")}</div></div>`;
}

/* ---- render: an active battle ---- */
function dRenderBattle(mine){
  const scn = dScn();
  let h = dPhaseBanner();
  const alive = dungeon.monsters.filter(m=>m.alive).length;
  const total = dungeon.monsters.length;
  h += `<div class="panel"><h3>${esc(scn.name)}</h3>
    <p>Round ${dungeon.round} · <b style="color:var(--sunset)">${alive} of ${total} monsters left</b></p>
    <p class="note" style="margin-top:4px">Clear every monster to win the scenario.</p></div>`;
  h += dRenderMap(scn);

  if (dungeon.sub==="selecting") h += dRenderSelecting(mine);
  else { h += dOrderList(); h += dRenderResolving(mine); }

  h += `<div class="panel"><h3>What happened</h3>${dungeon.log.length?dungeon.log.slice(0,12).map(l=>`<div class="log">${l.t}</div>`).join(""):`<p>Nothing yet.</p>`}</div>`;
  return h;
}
function dRenderSelecting(mine){
  if (mine.ko) return `<div class="panel"><h3>You're down</h3><p>Wait for the rest of the party — a heal can bring you back in.</p></div>`;
  if (mine.selected && mine.selected.ready){
    const waiting = dungeon.players.filter(p=>!p.ko && !(p.selected&&p.selected.ready)).map(p=>p.name);
    return `<div class="panel"><h3>Cards locked in</h3>
      <p>${waiting.length?`Waiting on ${waiting.map(esc).join(", ")}`:"Everyone's ready."}</p>
      ${!waiting.length?`<div class="acts"><button class="btn go" id="d_startround">Start the round</button></div>`:""}
      <div class="acts"><button class="btn ghost" id="d_unlock">Change my cards</button></div></div>`;
  }
  if (mine.hand.length<2){
    return `<div class="panel"><h3>Out of cards — rest</h3>
      <p>Short rest: get your discard back, but lose one card for the rest of this scenario.
      Long rest: get everything back and heal 2, but you sit out this round.</p>
      <div class="acts"><button class="btn solid" data-rest="short">Short rest</button><button class="btn go" data-rest="long">Long rest</button></div></div>`;
  }
  const cards = mine.hand.map(id=>dCard(mine.cls,id)).filter(Boolean);
  const cardA = dSel.a ? dCard(mine.cls,dSel.a) : null;
  const cardB = dSel.b ? dCard(mine.cls,dSel.b) : null;
  return `<div class="panel"><h3>Round ${dungeon.round} — pick two cards</h3>
    <p>One card gives you its <b style="color:var(--sand)">top</b> action, the other its <b style="color:var(--sand)">bottom</b> action. You'll do both, in that order.</p>
    <p class="note" style="margin-top:6px">${mine.hand.length} cards left in hand — these two go to your discard until you rest.</p>
    <div class="handgrid">${cards.map(c=>{
      const sel = dSel.a===c.id?"selA":dSel.b===c.id?"selB":"";
      return `<button class="hcard ${sel}" data-card="${c.id}">
        <div class="hn">${esc(c.n)}<span class="hi">${c.init}</span></div>
        <div class="ht">▲ ${dActText(c.top)}</div><div class="hb">▼ ${dActText(c.bot)}</div></button>`;
    }).join("")}</div>
    ${cardA&&cardB?`<div class="drawn" style="margin-top:12px">
        <p class="kind">This round you'll do</p>
        <h4 style="margin:6px 0 2px">1. ${dActText(cardA.top)}<span style="color:var(--kelp);font-weight:400;font-size:13px"> — top of ${esc(cardA.n)}</span></h4>
        <h4 style="margin:2px 0 0">2. ${dActText(cardB.bot)}<span style="color:var(--kelp);font-weight:400;font-size:13px"> — bottom of ${esc(cardB.n)}</span></h4>
        <p style="margin-top:8px">You act on initiative <b style="color:var(--syrup)">${cardA.init}</b> (lower goes first).</p>
      </div>
      <div class="acts"><button class="btn go" id="d_confirm">Lock in these two</button></div>`:
      `<p class="note">${!dSel.a?"Tap a card to use its TOP action.":"Now tap a different card to use its BOTTOM action."}</p>`}
  </div>`;
}
function dActText(a){
  if (a.a==="attack") return `Attack ${a.val}${a.rng?` (range ${a.rng})`:" (melee)"}`;
  if (a.a==="move") return `Move ${a.val}`;
  if (a.a==="heal") return `Heal ${a.val}${a.rng?` (range ${a.rng})`:" (self)"}`;
  if (a.a==="shield") return `Shield ${a.val}`;
  if (a.a==="taunt") return `Taunt`;
  return "";
}
function dRenderResolving(mine){
  const scn = dScn(), entry = dungeon.order[dungeon.turnPtr];
  if (!entry) return `<div class="panel"><h3>Round done</h3></div>`;
  if (entry.kind==="monster"){
    const m = dungeon.monsters.find(x=>x.id===entry.id);
    if (dMonsterStalled()){
      return `<div class="turnbanner"><h2>${esc(m?m.name:"Monster")}'s turn</h2>
        <p class="who">This one's stuck — the host's phone may be asleep.</p>
        <div class="acts"><button class="btn go" id="d_nudge">Tap to continue</button></div></div>`;
    }
    return `<div class="turnbanner"><h2>${esc(m?m.name:"Monster")}'s turn</h2><p class="who">Resolving on its own — just a second…</p></div>`;
  }
  const p = dungeon.players.find(x=>x.id===entry.id);
  if (entry.id!==mine.id) return `<div class="turnbanner"><h2>${esc(p.name)}'s turn</h2><p class="who">Waiting on them to act</p></div>`;
  return dRenderMyTurn(p, scn);
}
function dRenderMyTurn(p, scn){
  const step = p._step || "top";
  const cardA = dCard(p.cls, p.selected.a), cardB = dCard(p.cls, p.selected.b);
  if (!cardA || !cardB){
    /* selection referenced a card we can't resolve — recover instead of crashing */
    p.selected = null; p._step = null;
    return `<div class="panel"><h3>Card mix-up</h3><p>Your cards couldn't be read — pick two again.</p></div>`;
  }
  const action = step==="top" ? cardA.top : cardB.bot;
  const fromCard = step==="top" ? cardA : cardB;
  const otherCard = step==="top" ? cardB : cardA;
  const otherAction = step==="top" ? cardB.bot : cardA.top;
  let h = `<div class="turnbanner"><h2>Your turn</h2>
    <p class="who">Action ${step==="top"?"1":"2"} of 2 — ${dActText(action)}</p>
    <p class="who" style="font-size:12.5px;margin-top:6px;opacity:.85">
      from the <b style="color:var(--syrup)">${step==="top"?"top":"bottom"}</b> of <b style="color:var(--sand)">${esc(fromCard.n)}</b>
    </p>
    <p class="who" style="font-size:12px;margin-top:4px;opacity:.7">
      ${step==="top" ? `Next: ${dActText(otherAction)} from ${esc(otherCard.n)}` : `Last action this round`}
    </p></div>`;

  const highlight = {};
  if (action.a==="move") dReachable(scn,p.zone,action.val).forEach(z=>highlight[z]="go");
  else if (action.a==="attack") dungeon.monsters.filter(m=>dMonsterActive(m) && dDist(scn,p.zone,m.zone)<=action.rng).forEach(m=>highlight[m.zone]="atk");
  else if (action.a==="heal") dungeon.players.filter(pl=>dDist(scn,p.zone,pl.zone)<=action.rng).forEach(pl=>highlight[pl.zone]="go");
  h += dRenderMap(scn, highlight);

  const prompts = {move:"👉 Tap where to move", attack:"👉 Tap who to attack", heal:"👉 Tap who to heal",
    shield:"👉 Tap to brace", taunt:"👉 Tap to draw their attention"};
  const isAtk = action.a==="attack";
  h += `<div class="panel targetlist"><h4 class="${isAtk?"atk":""}">${prompts[action.a]||"👉 Tap to confirm"}</h4>`;
  if (action.a==="move"){
    dReachable(scn,p.zone,action.val).forEach(z => h += `<button data-act="move|${z}">${esc(scn.zones[z])}<span class="chev">›</span></button>`);
    if (!dReachable(scn,p.zone,action.val).length) h += `<button data-act="move|${p.zone}">Nowhere to go — skip<span class="chev">›</span></button>`;
  } else if (action.a==="attack"){
    const inRange = dungeon.monsters.filter(m=>dMonsterActive(m) && dDist(scn,p.zone,m.zone)<=action.rng);
    if (!inRange.length) h += `<button class="atk" data-act="skip">Nothing in range — skip<span class="chev">›</span></button>`;
    inRange.forEach(m => h += `<button class="atk" data-act="attack|${m.id}">${esc(m.name)} (${m.hp}/${m.maxHp} HP, ${esc(scn.zones[m.zone])})<span class="chev">›</span></button>`);
  } else if (action.a==="heal"){
    const inRange = dungeon.players.filter(pl=>dDist(scn,p.zone,pl.zone)<=action.rng);
    inRange.forEach(pl => h += `<button data-act="heal|${pl.id}">${pl.id===p.id?"Yourself":esc(pl.name)} (${pl.hp}/${dMaxHp(pl)} HP)<span class="chev">›</span></button>`);
  } else if (action.a==="shield" || action.a==="taunt"){
    h += `<button data-act="self">Do it<span class="chev">›</span></button>`;
  }
  h += `</div>`;
  return h;
}

/* ---- click handlers for the dungeon game ---- */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-dcls],#d_go,#d_begin,#d_beginanyway,[data-buy],#d_retry,[data-card],#d_confirm,#d_unlock,[data-rest],#d_startround,[data-act],#d_tutorial,[data-tut],#d_claimhost,#d_releasehost,#d_setcount,#d_resetall,#d_retrysync,#d_dorestore,#d_clearerr,#d_centremap,#d_nudge");
  if (!t) return; const g = n=>t.getAttribute(n);

  if (g("data-dcls")){ if(t.classList.contains("full")) return; [...t.parentNode.children].forEach(b=>b.classList.remove("on")); t.classList.add("on"); return; }

    const name=($("d_name").value||"").trim(); if(!name){ toast("Name first"); return; }
    const rawCode=($("d_code")&&$("d_code").value||"").trim();
